# anchors:template — gerado pelo `anchors`. Enquanto esta linha e o conteúdo abaixo
# não forem editados, `anchors doctor --fix` mantém o arquivo atualizado. Ao editar,
# REMOVA esta linha: é o que diz ao Anchors que o pipeline passou a ser seu, e o `--fix`
# para de tocá-lo (passa a avisar quando o padrão mudar, sem sobrescrever).
# Anchors — o BOARD publicado no Pages
#
# O board do GitHub Projects é uma ENTIDADE SEPARADA das issues: um item do Project é uma
# referência, criada explicitamente, e o campo `Status` dele não é a label. Nada liga um
# ao outro sozinho — medido num projeto real, com as 8 colunas corretamente configuradas
# e o board VAZIO, porque a automação nativa move o que já está lá, não adiciona.
#
# Ligar os dois exigiria um PAT com escopo `project` de todo adotante, que é o atrito que
# o desenho por labels existe para eliminar (BOOTSTRAP §7.13).
#
# Este pipeline resolve por outro caminho: as issues JÁ são o estado, e uma página estática
# as apresenta em colunas. Sem Projects, sem PAT — o `GITHUB_TOKEN` da própria Action lê
# issues do repositório, que é tudo que o board precisa.
name: anchors · publicar o board

on:
  # DISPARADO PELO FIM DOS OUTROS: quem altera issue é pipeline, e o board é a fotografia
  # do resultado. Reagir ao FIM (e não ao mesmo evento que eles) garante que a foto é
  # tirada depois da mudança, não durante.
  workflow_run:
    workflows:
      - "anchors · identificar trabalho"
      - "anchors · atribuir trabalho"
      - "anchors · PR verde move o card"
      - "anchors · liberar cards parados"
    types: [completed]
  # E POR MUDANÇA DIRETA na issue: uma label movida à mão na interface não passa por
  # pipeline nenhum, e sem isto o board mentiria até o próximo pipeline rodar.
  issues:
    types: [opened, closed, reopened, labeled, unlabeled, edited]
  workflow_dispatch:

# Serializado: quatro pipelines podem terminar quase juntos, e duas publicações
# simultâneas do mesmo site é uma sobrescrevendo a outra. `cancel-in-progress: true` aqui
# é DELIBERADO e diferente dos outros pipelines — o board é estado DERIVADO, e a execução
# mais nova sempre produz uma foto melhor que a que está no meio do caminho.
concurrency:
  group: anchors-board
  cancel-in-progress: true

# `contents: write` porque o board é COMMITADO num branch próprio, e não publicado por
# deploy direto — ver o comentário do passo de publicação.
permissions:
  contents: write
  issues: read

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # O ANCHORS é preciso aqui para ler o `needs:` do mapa — a ORDEM DE TRABALHO não
      # está na issue, está no header do artefato. Sem isto o board mostraria uma lista
      # plana, e a pergunta "o que dá para pegar AGORA?" continuaria exigindo abrir os
      # planos.
      - name: Instalar o Anchors
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANCHORS_VERSION: latest
        run: |
          set -euo pipefail
          if [ "$ANCHORS_VERSION" = "latest" ]; then
            TAG=$(gh release view --repo co2-lab/anchors --json tagName --jq .tagName)
          else
            TAG="$ANCHORS_VERSION"
          fi
          gh release download "$TAG" --repo co2-lab/anchors \
            --pattern 'anchors_*_linux_amd64.tar.gz' --output /tmp/anchors.tar.gz --clobber
          tar -xzf /tmp/anchors.tar.gz -C /tmp anchors
          sudo install /tmp/anchors /usr/local/bin/anchors

      # O PIPELINE está atualizado? Ver a nota em `anchors-identify.yml`.
      #
      # A verificação roda aqui TAMBÉM porque o board é disparado por schedule e por
      # `workflow_run`: ele executa mesmo quando ninguém abre PR, e é o caminho que alcança
      # um repositório parado — justamente onde o pipeline envelhece sem que ninguém veja.
      - name: Conferir se este pipeline está atualizado
        run: |
          # SEM `continue-on-error`: quem decide se isto barra é o PROJETO, pelo
          # `stale_pipeline_blocks` no anchors.yaml. O padrão do comando é avisar e sair
          # com 0 — e um `continue-on-error` aqui anularia a escolha de quem declarou que
          # prefere barrar.
          if ! anchors doctor --check-pipelines; then
            echo "::warning::Os pipelines do Anchors estão desatualizados — eles rodam, mas o que foi corrigido depois NÃO acontece. Rode \`anchors doctor --fix\`, commite e suba."
          fi

      - name: Gerar o board a partir das issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          LABEL: anchors
        run: |
          set -euo pipefail
          mkdir -p _board

          # O JSON é DERIVADO do estado atual, e nunca acumulado por edições
          # incrementais: se um pipeline falhar no meio, a próxima publicação conserta
          # sozinha. Um arquivo editado a cada mudança ficaria errado para sempre.
          #
          # E não é COMMITADO: estado derivado versionado enche o histórico de ruído e —
          # pior — cada commit dispararia o pipeline de identificação de novo, num laço.
          # O CORPO e o HISTÓRICO de posse vão no JSON: a página abre os detalhes do card
          # sem sair do board, e ir ao GitHub passa a ser escolha, não pedágio.
          #
          # O corpo é CORTADO em 4000 caracteres: um board com 500 cards de corpo inteiro
          # vira um JSON de megabytes que trava a página no primeiro carregamento — e a
          # modal é um resumo, não o lugar de ler uma issue inteira.
          # `--state all` e não só `open`: o ROADMAP precisa do que já foi entregue — é
          # dele que saem as datas REAIS (criado→fechado) da parte esquerda do Gantt. As
          # colunas do board continuam mostrando só os abertos; quem filtra é a página.
          #
          # `closedAt` é o que separa "entregue" de "em andamento" sem depender de label:
          # um card fechado tem data, um aberto não.
          # O DESCARTADO NÃO ENTRA, e o filtro é aqui — na origem.
          #
          # Filtrar na página deixaria o card no JSON, e quem consome o JSON (um painel
          # próprio, um relatório) o veria. O contrato é o que o board publica: se ele saiu
          # do board, saiu do dado.
          #
          # `--state all` continua porque o roadmap precisa do ENTREGUE — é como ele
          # desenha o passado. Descartado é outra coisa: é o que nunca teve sentido, ou
          # deixou de ter, e não pertence nem ao passado nem ao futuro.
          gh issue list --state all --label "$LABEL" --limit 500 \
            --json number,title,url,labels,comments,updatedAt,body,createdAt,closedAt,author \
            --jq '[.[] | select([.labels[].name] | any(. == "anchors:discarded") | not) | {
                    number: .number,
                    title: .title,
                    url: .url,
                    updated: .updatedAt,
                    created: .createdAt,
                    closed: (.closedAt // ""),
                    author: (.author.login // ""),
                    body: (.body // "" | .[0:4000]),
                    labels: [.labels[].name],
                    code: (.title | capture("^\\[(?<c>[^]]+)\\]").c? // ""),
                    # O CAMINHO que o achado cita: `[gate] Violação @ caminho/Arquivo.spec.md`.
                    # É por ele que o achado se liga à unidade — ver o passo "afiliar".
                    target: (.title | capture("@\\s+(?<p>[^ :]+)").p? // ""),
                    state: ([.labels[].name | select(startswith("anchors:"))
                              | select(. != "anchors:needs-user")] | .[0] // "anchors:to-do"),
                    escalated: ([.labels[].name] | any(. == "anchors:needs-user")),
                    linkedTo: ([.labels[].name
                               | select(startswith("anchors:under-") or startswith("anchors:desbloqueia-"))
                               | sub("^anchors:(under|desbloqueia)-";"")] | .[0] // ""),
                    unblocks: ([.labels[].name | select(startswith("anchors:desbloqueia-"))
                                | sub("^anchors:desbloqueia-";"")] | .[0] // ""),
                    owner: ([.comments[].body | select(startswith("anchors-owner:"))] | last // "" |
                           sub("^anchors-owner: *";"") |
                           if test("\\(liberado\\)") then "" else . end),
                    ownership: [.comments[].body | select(startswith("anchors-owner:")) |
                            sub("^anchors-owner: *";"")],
                    comments: (.comments | length)
                  }]' > _board/board.json

          # PENDENTE agora, ou RESOLVIDO um dia? — e o board contava as duas coisas junto.
          #
          # A label `anchors:needs-user` diz que o card ESPEROU uma pessoa. Não diz se ainda
          # espera: ela fica no card depois que a decisão sai, e só o `anchors decided` ou o
          # pipeline de desbloqueio a removem.
          #
          # MEDIDO: o card #311 aparecia como pendência do usuário em `ready-to-test` — o
          # trabalho tinha entrado pelo PR #402, os dois achados que o travavam (#441, #442)
          # estavam FECHADOS, e a label continuava lá. Quem olha o board vê uma fila de
          # pendências que em parte já foi resolvida, e a que importa se perde no meio.
          #
          # O FATO que separa: os cards abertos SOB este (`under-<n>`, `desbloqueia-<n>`).
          # Se algum está aberto, a espera é real. Se todos fecharam, a decisão saiu — o
          # card fica marcado como RESOLVIDO, e não some do board: quem escalou precisa ver
          # que a resposta veio.
          # TRÊS SITUAÇÕES, e a diferença entre a segunda e a terceira é o que importa:
          #
          #   · o card tem trabalho ABERTO sob ele       → espera (o trabalho não terminou)
          #   · o card TEVE trabalho sob ele, e fechou   → já respondido
          #   · o card NUNCA teve card sob ele           → ESPERA VOCÊ, diretamente
          #
          # A terceira é a mais comum — a decisão que ninguém tomou ainda não gerou trabalho
          # nenhum — e a primeira versão disto a marcava como respondida: `esperando` era
          # `(abertos > 0)`, e um card sem vínculo tem zero abertos.
          #
          # MEDIDO: o #400 do projeto de referência ("nenhum workflow roda `pnpm typecheck`")
          # nunca foi respondido e apareceu como já-respondido. O sinal invertido no caso
          # mais frequente é pior que não ter sinal: ensina a ignorar a cor.
          for n in $(jq -r '.[] | select(.escalated) | .number' _board/board.json); do
            abertos=0
            existem=0
            for pref in under desbloqueia; do
              a=$(gh issue list --repo "$GH_REPO" --state open --label "anchors:$pref-$n" --limit 20 --json number --jq 'length' 2>/dev/null || echo 0)
              e=$(gh issue list --repo "$GH_REPO" --state all --label "anchors:$pref-$n" --limit 20 --json number --jq 'length' 2>/dev/null || echo 0)
              abertos=$(( abertos + a ))
              existem=$(( existem + e ))
            done
            # RESPONDIDO exige as DUAS coisas: já houve trabalho, E ele acabou. Sem a
            # primeira, "zero abertos" quer dizer "ninguém respondeu ainda".
            if [ "$existem" -gt 0 ] && [ "$abertos" = "0" ]; then
              waiting=false; msg="a decisão saiu e o trabalho sob ele terminou"
            elif [ "$abertos" -gt 0 ]; then
              waiting=true;  msg="$abertos card(s) aberto(s) sob ele"
            else
              waiting=true;  msg="espera uma decisão — nenhum trabalho foi aberto sob ele"
            fi
            jq --argjson n "$n" --argjson e "$waiting" --argjson a "$abertos" \
              'map(if .number == $n then . + {waiting: $e, openUnder: $a} else . end)' \
              _board/board.json > _board/board.tmp && mv _board/board.tmp _board/board.json
            echo "· #$n $msg"
          done

          # O carimbo de quando a foto foi tirada. Um board sem isso não se distingue de
          # um board que parou de atualizar — e o leitor confia num dado velho.
          # A ORDEM DE TRABALHO vem do MAPA, não da issue: `needs:` vive no header do
          # artefato, que é a âncora. Cruzar aqui pelo código é o que permite a página
          # desenhar a árvore — e um item pode ter VÁRIOS pais (a spec de teste depende de
          # duas fases), o que a hierarquia pai/filho do GitHub não representaria.
          anchors code list --json > /tmp/codigos.json 2>/dev/null || echo '[]' > /tmp/codigos.json
          jq --slurpfile cod /tmp/codigos.json \
            '[.[] as $i | $i + {
                needs: ([$cod[0][] | select(.code == $i.code) | .needs // []] | first // []),
                parent: ([$cod[0][] | select(.code == $i.code) | .parent // ""] | first // "")
              }]' _board/board.json > /tmp/comneeds.json
          mv /tmp/comneeds.json _board/board.json

          # As FASES catalogadas nos planos: o board precisa do TÍTULO delas para nomear o
          # agrupamento — `FNDTN-F01` sozinho não diz nada a quem lê.
          # O TÍTULO da fase é o que vem antes do "(depende de ...)": a dependência é
          # DADO, e deixá-la no título faria o board escrever "a régua mecânica (depende
          # de FNDTN-F01)" onde deveria dizer só o nome.
          #
          # E a fase declara o `needs` DELA, extraído do mesmo parêntese: sem isso a
          # cadeia F03 → F02 → F01 não se forma, e todos os itens caem no mesmo nível.
          grep -rhoE '^#{2,4} +[A-Z0-9]{4,5}-F[0-9]{2} +[—-] +.*' plans/ 2>/dev/null |
            sed -E 's/^#+ +([A-Z0-9]+-F[0-9]+) +[—-] +(.*)$/\1\t\2/' |
            while IFS=$'\t' read -r cod resto; do
              titulo=$(echo "$resto" | sed -E 's/ *\(depende d[eao][^)]*\) *//I')
              deps=$(echo "$resto" | grep -oE '[A-Z0-9]{4,5}-F[0-9]{2}' | jq -R . | jq -sc '.')
              jq -nc --arg c "$cod" --arg t "$titulo" --argjson d "${deps:-[]}" \
                '{code:$c, title:$t, needs:$d, parent:($c | split("-")[0])}'
            done | jq -s '.' > /tmp/fases.json || echo '[]' > /tmp/fases.json

          # AFILIAR O ACHADO À UNIDADE QUE ELE ACUSA.
          #
          # Um achado de gate — `[doc-required] Violação @ caminho/Arquivo.spec.md` — não tem
          # código de unidade no título: o que está entre colchetes é o nome do GATE. Sem
          # `parent`, ele fica solto na raiz do roadmap.
          #
          # MEDIDO no projeto de referência: 201 dos 304 cards eram achados, todos na raiz —
          # uma lista de desfiliados maior que a árvore inteira, e o leitor não tem como
          # saber a que trabalho cada um pertence.
          #
          # O VÍNCULO ESTÁ NO TÍTULO: o caminho do arquivo. E o MAPA sabe qual unidade vive
          # em cada caminho — é a informação que ele existe para guardar. Cruzando os dois,
          # 143 dos 201 achados encontram a sua unidade.
          #
          # Os 58 restantes acusam arquivo fora do mapa (um guia, um workflow) ou um alvo
          # agregado. Eles seguem na raiz, e é o lugar certo: não pertencem a unidade nenhuma.
          if [ -f anchors.graph.yaml ]; then
            python3 - <<'AFILIA' || echo "⚠ não consegui afiliar os achados — seguem na raiz"
          import json, re, io
          try:
              import yaml
          except ImportError:
              raise SystemExit(0)
          g = yaml.safe_load(io.open('anchors.graph.yaml', encoding='utf-8')) or {}
          porCaminho = {}
          for n in g.get('nodes', []):
              c = n.get('code') or n.get('code') or ''
              if re.fullmatch(r'[A-Z]{5}', c):
                  porCaminho[n.get('id', '')] = c
          itens = json.load(io.open('_board/board.json', encoding='utf-8'))
          porNumero = {i.get('number'): i for i in itens}

          # A ÁRVORE É MONTADA EM MEMÓRIA, num passe só.
          #
          # Repetir passes até estabilizar resolveria — e custaria N passes numa árvore de N
          # níveis, sobre 300 itens. Pior: esconderia a inconsistência, porque um vínculo que
          # aponta para um card inexistente se parece com um que ainda não foi visitado.
          #
          # Aqui cada achado registra o PAI que ele declara, seja ele conhecido ou não. A
          # resolução acontece depois, seguindo as referências — e o que não fecha é
          # DENUNCIADO, porque é dado inconsistente na issue, não limitação do algoritmo.
          def unidade(i):
              """O código de unidade do próprio card, ou '' se ele não for uma unidade."""
              c = i.get('code') or ''
              return c if re.fullmatch(r'[A-Z]{5}', c) else ''

          # PASSE ÚNICO: cada achado declara de quem depende — o caminho que acusa, ou o
          # número a que está vinculado. Nada é resolvido ainda.
          declara = {}
          for i in itens:
              if unidade(i) or i.get('parent'):
                  continue
              c = porCaminho.get((i.get('target') or '').rstrip(':.,'))
              if c:
                  declara[i['number']] = ('unidade', c)
              else:
                  v = str(i.get('linkedTo') or '')
                  if v.isdigit():
                      declara[i['number']] = ('card', int(v))

          # RESOLUÇÃO por referência, com memória: cada cadeia é percorrida UMA vez, e o
          # resultado fica guardado para quem passar por ela depois.
          resolvido = {}
          orfaos = []

          def resolve(num, caminho):
              if num in resolvido:
                  return resolvido[num]
              if num in caminho:                      # ciclo entre vínculos
                  return None
              i = porNumero.get(num)
              if i is None:                           # aponta para card que não existe
                  return None
              alvo = unidade(i) or i.get('parent') or None
              if alvo is None:
                  d = declara.get(num)
                  if d is None:
                      alvo = None
                  elif d[0] == 'unidade':
                      alvo = d[1]
                  else:
                      alvo = resolve(d[1], caminho | {num})
              resolvido[num] = alvo
              return alvo

          n = 0
          for num, d in declara.items():
              alvo = d[1] if d[0] == 'unidade' else resolve(d[1], {num})
              if alvo:
                  porNumero[num]['parent'] = alvo
                  n += 1
              else:
                  orfaos.append((num, d))

          json.dump(itens, io.open('_board/board.json', 'w', encoding='utf-8'), ensure_ascii=False)
          print(f"· {n} achado(s) afiliado(s) à unidade que acusam")

          # O QUE NÃO FECHOU É INCONSISTÊNCIA DA ISSUE, e merece nome.
          #
          # Um vínculo que aponta para um card inexistente, ou uma cadeia que se fecha em
          # ciclo, não é limitação daqui: é dado errado no board. Silenciar transformaria o
          # card num órfão indistinguível dos que legitimamente não têm pai.
          # TRÊS MOTIVOS distintos, e o diagnóstico precisa dizer qual:
          #
          #   · o card apontado NÃO EXISTE       → o vínculo está errado na issue
          #   · a cadeia se fecha em CICLO       → dois cards apontando um ao outro
          #   · a cadeia TERMINA sem unidade     → nenhum elo é uma unidade, e isso é
          #     legítimo: um `[plano]` pode pender de outro `[plano]` que não pende de nada
          #
          # O terceiro não é defeito, e chamá-lo de ciclo mandaria procurar o que não há.
          def motivo(num, alvo, caminho=None):
              caminho = caminho or set()
              if alvo not in porNumero:
                  return "o card #%d não existe" % alvo
              if alvo in caminho:
                  return "ciclo de vínculos"
              i = porNumero[alvo]
              d = declara.get(alvo)
              if d is None or d[0] == 'unidade':
                  return "a cadeia termina em #%d, que não é uma unidade" % alvo
              return motivo(num, d[1], caminho | {alvo})

          quebrados = [(num, d) for num, d in orfaos if d[0] == 'card']
          if quebrados:
              print(f"⚠ {len(quebrados)} vínculo(s) que não levam a uma unidade:")
              for num, d in quebrados[:10]:
                  print(f"    #{num} → #{d[1]}: {motivo(num, d[1], {num})}")
          json.dump(itens, io.open('_board/board.json', 'w', encoding='utf-8'), ensure_ascii=False)
          print(f"· {n} achado(s) afiliado(s) à unidade que acusam")
          AFILIA
          fi


          jq -n --slurpfile items _board/board.json --slurpfile phases /tmp/fases.json \
                --arg takenAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
                --arg repo "$GH_REPO" \
                '{takenAt: $takenAt, repo: $repo, phases: ($phases[0] // []), items: $items[0]}' > _board/dados.json
          mv _board/dados.json _board/board.json
          echo "$(jq '.items | length' _board/board.json) card(s) no board"

      - name: Montar a página
        run: cp .github/anchors-board.html _board/index.html

      # O BOARD NÃO PUBLICA O SITE — ele ACRESCENTA uma pasta ao que já existe.
      #
      # `deploy-pages` substitui o site INTEIRO pelo artefato enviado. Num projeto que já
      # tem landing page, documentação ou qualquer coisa no Pages, publicar o board por
      # deploy direto TROCARIA o site pelo board — uma perda que ninguém pediu e que só se
      # descobre quando alguém abre o endereço.
      #
      # Então o board escreve numa SUBPASTA do branch que serve o Pages, e não toca em
      # mais nada. Quem já tem site continua com ele em `/`, e ganha o board em
      # `/anchors-board/`. Quem não tem, o Pages passa a servir a subpasta e a raiz fica
      # livre para o site que vier depois.
      - name: Publicar em uma subpasta, sem tocar no resto do site
        env:
          BRANCH_PAGES: ${{ vars.ANCHORS_PAGES_BRANCH || 'gh-pages' }}
          SUBPASTA: anchors-board
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # O branch pode não existir ainda: nesse caso ele nasce ÓRFÃO, sem herdar o
          # histórico do código — um branch de publicação que carrega o repositório
          # inteiro é peso morto em todo clone.
          if git ls-remote --exit-code --heads origin "$BRANCH_PAGES" >/dev/null 2>&1; then
            git fetch origin "$BRANCH_PAGES" --depth=1
            git checkout "$BRANCH_PAGES"
          else
            git checkout --orphan "$BRANCH_PAGES"
            git rm -rf . >/dev/null 2>&1 || true
            echo "branch $BRANCH_PAGES criado (não existia)"
          fi

          # `rm -rf` da SUBPASTA e só dela: o resto do branch — o site de quem já tinha um
          # — não é tocado.
          rm -rf "$SUBPASTA"
          mkdir -p "$SUBPASTA"
          cp _board/board.json _board/index.html "$SUBPASTA/"
          # `.nojekyll` porque o Jekyll ignora pastas iniciadas por `_` e reescreve o que
          # não entende. O board é HTML puro e não quer processamento nenhum.
          touch .nojekyll

          git add "$SUBPASTA" .nojekyll
          if git diff --cached --quiet; then
            echo "board sem mudança — nada a publicar"
            exit 0
          fi
          git commit -m "anchors: board $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push origin "$BRANCH_PAGES"
          echo "board em https://$(echo "$GITHUB_REPOSITORY" | cut -d/ -f1).github.io/$(echo "$GITHUB_REPOSITORY" | cut -d/ -f2)/$SUBPASTA/"
