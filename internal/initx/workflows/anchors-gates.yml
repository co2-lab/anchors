# anchors:template — gerado pelo `anchors`. Enquanto esta linha e o conteúdo abaixo
# não forem editados, `anchors doctor --fix` mantém o arquivo atualizado. Ao editar,
# REMOVA esta linha: é o que diz ao Anchors que o pipeline passou a ser seu, e o `--fix`
# para de tocá-lo (passa a avisar quando o padrão mudar, sem sobrescrever).
# Anchors — os GATES no PR: a fronteira real
#
# O pre-commit roda os gates na máquina de quem commita, e isso é rápido e útil — mas
# não é fronteira. `git commit --no-verify` o contorna com uma flag, e o trabalho entra
# no repositório sem passar por gate nenhum. Medido no projeto de referência: os quatro
# checks do PR estavam verdes e NENHUM confrontava os gates.
#
# Este pipeline é o que torna verdadeira a frase da doutrina: "nada sobe se não passar".
# O gate local dá agilidade; este dá a garantia (QUALITY.md §8).
#
# Roda `--all`, e não `--changed`: um PR pode QUEBRAR um arquivo que ele não tocou —
# renomear um símbolo, mover uma spec, mudar uma regra que outra unidade cita. O
# `--changed` seguiria o raio de impacto do que mudou, e o raio é calculado sobre o mapa,
# que pode estar velho justamente por causa deste PR.
name: anchors · gates

on:
  pull_request:
    types: [opened, reopened, synchronize]
  # À MÃO: um PR cujo evento se perdeu, ou uma conferência que alguém quer refazer sem
  # empurrar commit vazio. Pipeline sem escape manual transforma percalço em trabalho
  # parado sem remédio.
  workflow_dispatch:

# NÃO é serializado, diferente dos pipelines que escrevem label: este só LÊ o repositório
# e reporta. Serializar faria cada PR esperar a fila dos outros sem necessidade.
concurrency:
  group: anchors-gates-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  # LER O PR exige permissão própria: com `contents: read` sozinho, o `gh pr view`
  # devolve VAZIO em vez de erro, e a conferência da palavra-chave concluía "o PR não
  # cita card" em todo PR. Medido na primeira execução do passo.
  pull-requests: read

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # O histórico inteiro: gates que confrontam a MUDANÇA (`plano-alterado-justificado`)
          # perguntam ao git o que mudou, e com clone raso a resposta é sempre "tudo".
          fetch-depth: 0

      - name: Instalar o Anchors
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Fixe uma versão (`v1.2.3`) quando quiser que o pipeline pare de mudar sozinho:
          # `latest` faz o comportamento do CI depender de quando ele rodou.
          ANCHORS_VERSION: latest
        run: |
          set -euo pipefail
          if [ "$ANCHORS_VERSION" = "latest" ]; then
            TAG=$(gh release list --repo co2-lab/anchors --limit 1 --json tagName --jq '.[0].tagName')
          else
            TAG="$ANCHORS_VERSION"
          fi
          gh release download "$TAG" --repo co2-lab/anchors \
            --pattern 'anchors_*_linux_amd64.tar.gz' --output /tmp/anchors.tar.gz --clobber
          tar -xzf /tmp/anchors.tar.gz -C /tmp anchors
          sudo install /tmp/anchors /usr/local/bin/anchors
          anchors --version

      - name: Conferir se este pipeline está atualizado
        run: |
          # SEM `continue-on-error` E SEM ENGOLIR O CÓDIGO DE SAÍDA: quem decide se isto
          # barra é o PROJETO, pelo `stale_pipeline_blocks` no anchors.yaml — e o `doctor`
          # já implementa essa decisão, saindo com 1 quando o projeto a declarou.
          #
          # HAVIA AQUI UM `if ! ...; then echo ::warning::; fi`, e ele ANULAVA a decisão: o
          # `if` consome o código de saída, então o passo passava verde mesmo com o projeto
          # tendo declarado `true`. O comentário acima dizia que o projeto decide, e o
          # código logo abaixo tirava a decisão dele.
          #
          # MEDIDO (#798): mutação aplicada ao próprio pipeline — 6 dos 10 passos de
          # verificação somem sem que NENHUM sinal acuse. Os quatro passos deste arquivo
          # eram o único caso detectado, e por este comando; mas o aviso saía de dentro do
          # arquivo verificado, então apagar o passo apagava o aviso junto.
          #
          # Agora o comando decide: `stale_pipeline_blocks: false` (ou ausente) faz o
          # `doctor` sair com 0 e imprimir o aviso ele mesmo; `true` faz sair com 1 e o
          # passo reprova.
          anchors doctor --check-pipelines

      - name: O mapa está em dia?
        run: |
          set -euo pipefail
          # O mapa é VERSIONADO e chega pronto no push. Se ele estiver velho, os gates
          # confrontariam uma foto que não é a deste PR — e reportariam verde sobre o que
          # não mediram, que é pior que reprovar.
          #
          # `map build` sobre uma cópia: comparar é a conferência, e reescrever o arquivo
          # aqui esconderia justamente o que se quer denunciar.
          cp anchors.graph.yaml /tmp/mapa-commitado.yaml
          anchors map build >/dev/null 2>&1 || true
          # DOIS campos são ignorados, e por razões diferentes:
          #
          #   • `generated_by` muda com a versão do binário, e isso não é mapa velho.
          #     O nome antigo (`gerado_por`) continua na lista: um PR aberto ANTES da
          #     migração para o formato 2 carrega o mapa com a chave velha, e filtrar só
          #     a nova faria o gate reprovar por uma diferença que ele mesmo declara
          #     ignorar. Medido: três PRs reprovaram de uma vez quando o campo foi
          #     renomeado, todos por isto.
          #
          #   • `version` é o FORMATO do mapa, e ele muda quando o Anchors evolui — não
          #     quando o PR está desatualizado. Um PR aberto antes da mudança de formato
          #     traz o número velho, e o `map build` do CI escreve o novo: a diferença é
          #     entre versões da FERRAMENTA, que é exatamente o que as outras duas linhas
          #     desta lista existem para ignorar.
          #
          #     Filtrá-lo NÃO esconde mapa velho: o que denuncia mapa velho é o CONTEÚDO
          #     (nós e arestas com rev defasado), e esse continua sendo comparado. Um PR
          #     cujo mapa está realmente para trás reprova pelas linhas de nó, não pelo
          #     cabeçalho.
          #
          #   • `updated_at` é a data do ÚLTIMO COMMIT do arquivo, e o mapa é gerado
          #     ANTES do commit que o carrega. Quem escreve um arquivo hoje gera o mapa
          #     com a data anterior, commita os dois juntos, e no CI o `map build` já vê
          #     a data nova. É um ciclo que nenhum `map build` fecha — todo PR que toca
          #     arquivo governado cairia aqui.
          filtra() { grep -vE '^ *(generated_by|gerado_por|version|updated_at):' "$1"; }
          if ! diff -q <(filtra /tmp/mapa-commitado.yaml) \
                       <(filtra anchors.graph.yaml) >/dev/null; then
            echo "::error::O \`anchors.graph.yaml\` commitado não corresponde ao repositório. Rode \`anchors map build\`, commite e suba — sem isso os gates confrontam uma foto velha."
            diff <(filtra /tmp/mapa-commitado.yaml) <(filtra anchors.graph.yaml) | head -40
            exit 1
          fi
          echo "✓ o mapa commitado corresponde ao repositório"

      - name: Os cards deste trabalho vão fechar?
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # A régua NÃO é "o corpo tem a palavra em inglês" — isso seria uma exigência da
          # PLATAFORMA vazando para dentro da doutrina, e o Anchors é multi-idioma. A
          # primeira versão deste passo fazia isso, e estava errada pelo mesmo motivo que
          # tiramos match de prosa dos gates.
          #
          # A régua é: os cards que este trabalho fecha estão declarados no corpo, na
          # sintaxe que a plataforma entende? Quem sabe QUAIS cards é o Anchors (o
          # `anchors-owner:` e a label `anchors:under-<n>`); quem sabe a SINTAXE é o
          # `anchors pr-body`. O corpo é confrontado com o que ele mesmo geraria.
          if ! corpo=$(gh pr view "${{ github.event.pull_request.number }}" --repo "$GH_REPO" --json body --jq .body 2>&1); then
            echo "::warning::não consegui ler o corpo do PR — a conferência não aconteceu: $corpo"
            exit 0
          fi
          # OS CARDS RAIZ saem do próprio corpo: o CI não tem `ANCHORS_AGENT` (a
          # identidade é de quem trabalha, não do runner), e adivinhar pelo branch seria
          # inventar vínculo.
          #
          # Sem isto o passo era decorativo: o `pr-body` devolvia vazio em toda execução e
          # a conferência nunca acontecia. Um gate que nunca confronta é pior que nenhum —
          # ele dá a impressão de que alguém está olhando.
          # BLOCOS DE CÓDIGO ficam de fora: um PR que DOCUMENTA a sintaxe (`anchors
          # pr-body` mostrando `Closes #44` como exemplo) não está declarando aqueles
          # cards. Medido — o primeiro PR a usar este passo tinha o exemplo na descrição,
          # e o gate leu como declaração real. Se um achado de verdade estivesse faltando,
          # o exemplo o teria mascarado.
          fora_de_bloco=$(printf '%s' "$corpo" | awk '/^```/ {dentro = !dentro; next} !dentro {print}')
          # `|| true` no fim: com `set -o pipefail` um `grep` que não casa derruba o
          # PIPE INTEIRO, e o script morre sem imprimir nada — foi o que fez este passo
          # sair com 1 num PR que simplesmente não declara card. O caso "não encontrou" é
          # normal aqui, não é erro.
          raiz=$(printf '%s' "$fora_de_bloco" | grep -oiE '(close[sd]?|fix(e[sd])?|resolve[sd]?) +#[0-9]+' | grep -oE '[0-9]+' | paste -sd, - || true)
          if [ -z "$raiz" ]; then
            echo "· o PR não declara card — nada a conferir"
            exit 0
          fi

          # O CARD ESTÁ NA COLUNA QUE ESTE TRABALHO DESCREVE?
          #
          # Um PR aberto significa que alguém está trabalhando — e o card precisa dizer
          # isso. Se ele está em `to-do`, o `anchors next` foi pulado: ninguém registrou
          # posse, e o board mostra como disponível um trabalho que já tem PR.
          #
          # MEDIDO no projeto de referência: 38 dos 44 PRs abertos tinham o card em
          # `to-do`. O efeito não é cosmético — o `claim` prioriza `ready-to-review` sobre
          # `to-do`, e encontrava a fila de revisão VAZIA enquanto 46 trabalhos esperavam.
          # Cada agente pegava trabalho novo em vez de revisar o que estava pronto.
          #
          # REPROVA, e não avisa. O `pr-checks` já avisava ("card não está em trabalho
          # ativo — nada a fazer") e o aviso não impediu 38 ocorrências. Um gate que
          # acusa e deixa passar ensina que o passo é opcional.
          #
          # A SAÍDA é rodar o claim — e ela está na mensagem, porque um gate que reprova
          # sem dizer o que fazer transfere o problema em vez de resolvê-lo.
          semClaim=""
          for c in $(printf '%s' "$raiz" | tr ',' ' '); do
            # A LABEL DO ANCHORS confirma jurisdição. `gh issue view` pega um número
            # específico e não aceita `--label` como filtro — então a conferência vai no
            # `jq`: sem a label-raiz, o `estado` sai vazio e o card cai no caso "não é do
            # fluxo", que passa. É a mesma pergunta que os outros pipelines fazem com
            # `--label "$LABEL"` no `issue list`.
            estado=$(gh issue view "$c" --repo "$GH_REPO" --json labels \
              --jq 'if ([.labels[].name] | index("anchors")) then
                      [.labels[].name] | map(select(startswith("anchors:"))) | join(" ")
                    else "" end' 2>/dev/null || echo "")
            case "$estado" in
              # ESTADOS DE TRABALHO EM CURSO: o card diz que alguém está nele.
              *in-progress*|*ready-to-review*|*in-review*) ;;
              # DE `ready-to-test` EM DIANTE o Anchors saiu da alçada — um PR que corrige
              # algo já entregue é legítimo, e cobrar claim ali seria cobrar duas vezes.
              *ready-to-test*|*in-test*|*ready-to-release*|*production*) ;;
              # SEM LABEL DE ESTADO o card não é do fluxo (uma issue comum), e a régua
              # não tem jurisdição sobre ele.
              "") ;;
              *) semClaim="$semClaim #$c" ;;
            esac
          done
          if [ -n "$semClaim" ]; then
            echo "::error::o(s) card(s)$semClaim ainda estão em \`to-do\` — o \`anchors next\` foi pulado, e o board mostra como disponível um trabalho que já tem PR"
            {
              echo "### ✗ O card não foi reivindicado"
              echo ""
              echo "Este PR declara$semClaim, e esse(s) card(s) continuam em \`to-do\`."
              echo ""
              echo "**O que isso quebra.** O \`claim\` serve \`ready-to-review\` antes de"
              echo "\`to-do\`: revisar tem prioridade sobre trabalho novo. Um card que nunca"
              echo "entra na coluna de revisão faz o próximo agente encontrá-la vazia — e ele"
              echo "pega trabalho novo em vez de revisar o que está pronto."
              echo ""
              echo "Medido: 38 de 44 PRs abertos com o card ainda em \`to-do\`, e a fila de"
              echo "revisão vazia enquanto 46 trabalhos esperavam."
              echo ""
              echo "**A ordem que o fluxo espera:**"
              echo ""
              echo '```console'
              echo "\$ anchors next          # registra a posse e move o card"
              echo "\$ # implementar"
              echo "\$ anchors pr-body --cards <n>"
              echo '```'
              echo ""
              echo "O claim escreve o \`anchors-owner\` no card — é por ele que o fluxo sabe"
              echo "de quem é o trabalho, e a quem NÃO servir a revisão."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          # E o que se confere é o que FALTA: os achados que nasceram sob os cards
          # declarados. Eles se entregam no mesmo PR, e esquecê-los deixa o board
          # afirmando que há trabalho pendente que já foi feito.
          if ! esperado=$(anchors pr-body --cards "$raiz" --so-sob 2>/dev/null) || [ -z "$esperado" ]; then
            echo "✓ os cards declarados não têm achados pendentes sob eles"
            exit 0
          fi
          faltando=""
          while IFS= read -r linha; do
            [ -z "$linha" ] && continue
            printf '%s' "$fora_de_bloco" | grep -qF "$linha" || faltando="$faltando $linha"
          done <<< "$esperado"
          if [ -n "$faltando" ]; then
            echo "::warning::Nasceram SOB os cards deste PR e não estão declarados:$faltando — ficariam abertos depois do merge. Rode \`anchors pr-body --cards $raiz\` e cole a saída no corpo do PR."
          else
            echo "✓ os cards deste trabalho e o que nasceu sob eles estão declarados"
          fi

      - name: Confrontar os gates
        run: |
          set -euo pipefail
          # `--no-record` porque este pipeline NÃO escreve: ele reporta. Registrar daqui
          # abriria cards a cada push de PR — inclusive de trabalho que o autor ainda vai
          # corrigir na próxima revisão —, e o board viraria ruído.
          anchors check --all --no-record
