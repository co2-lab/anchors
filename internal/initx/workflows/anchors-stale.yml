# Anchors — pipeline de CARDS ÓRFÃOS
#
# Um agente pode reivindicar um card e desaparecer: a sessão termina, a máquina desliga.
# O card fica com dono, e por isso ninguém o pega — mas o dono não existe mais. Sem este
# pipeline, o trabalho para ali e nada acusa a causa.
#
# A liberação é um comentário novo, nunca uma edição: `anchors-owner: (liberado)` passa a
# ser o último, e o card volta à fila. O HISTÓRICO PERMANECE — dá para ver quem tinha
# pegado, quando, e que foi liberado por inatividade e não por decisão de alguém.
# anchors:template — gerado pelo `anchors`. Enquanto esta linha e o conteúdo abaixo
# não forem editados, `anchors doctor --fix` mantém o arquivo atualizado. Ao editar,
# REMOVA esta linha: é o que diz ao Anchors que o pipeline passou a ser seu, e o `--fix`
# para de tocá-lo (passa a avisar quando o padrão mudar, sem sobrescrever).
name: anchors · liberar cards parados

on:
  schedule:
    # De 30 em 30 minutos. A frequência define a LATÊNCIA da detecção, não o critério:
    # quem decide se um card está parado é `HORAS_ATE_STALE`, abaixo.
    #
    # O `schedule` do GitHub Actions não é pontual — sob carga o disparo atrasa, e
    # agendamentos muito frequentes podem ser descartados. Se a latência vier a incomodar,
    # o caminho confiável não é apertar o cron: é o agente disparar este workflow
    # (`workflow_dispatch`) quando não acha card livre — aí a verificação acontece
    # exatamente quando alguém precisa de trabalho.
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: anchors-stale
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  liberar:
    runs-on: ubuntu-latest
    steps:
      - name: Liberar cards sem progresso
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Sem `actions/checkout` (não precisamos do código), o `gh` não descobre o
          # repositório pelo git local — `GH_REPO` é o que o diz.
          GH_REPO: ${{ github.repository }}
          LABEL: anchors
          # Quantas horas sem QUALQUER atualização fazem um card ser considerado parado.
          # Ajuste ao ritmo do time: baixo demais rouba o card de quem está trabalhando
          # devagar; alto demais deixa trabalho parado sem ninguém olhando.
          HORAS_ATE_STALE: "6"
        run: |
          set -euo pipefail

          limite=$(date -u -d "-${HORAS_ATE_STALE} hours" +%Y-%m-%dT%H:%M:%SZ)

          # Um card é candidato quando tem dono (último `anchors-owner` não liberado) e
          # não recebe atualização desde o limite. `updatedAt` cobre commit referenciado,
          # comentário e mudança de label — qualquer sinal de vida conta como progresso.
          # `--label "$LABEL"` não é detalhe: o board é compartilhado, e sem o filtro
          # este pipeline "liberaria" cards de outros fluxos — mexendo em trabalho que
          # não é do Anchors e cujo dono não se registra por `anchors-owner`.
          # RECICLÁVEIS são só os estados de trabalho ATIVO. A distinção é entre travado
          # e esperando: um card em `in-progress` sem sinal de vida é um agente que
          # morreu, e reciclar devolve o trabalho à fila; um card em `ready-to-review`
          # está parado POR DEFINIÇÃO — terminou e aguarda revisor humano, e ninguém
          # comenta enquanto isso. Sem este filtro, o stale joga trabalho PRONTO de volta
          # em `to-do` e o próximo agente o refaz do zero.
          gh issue list --state open --label "$LABEL" --limit 200 \
            --json number,updatedAt,comments,labels \
            --jq "[.[] | select(.updatedAt < \"$limite\")
                  | select([.labels[].name] | any(. == \"anchors:in-progress\" or . == \"anchors:in-review\" or . == \"anchors:in-test\"))
                  | select(
                    ([.comments[].body | select(startswith(\"anchors-owner:\"))] | last // \"\")
                    | (. != \"\" and (endswith(\"(liberado)\") | not))
                  )] | .[].number" |
          while read -r n; do
            [ -n "$n" ] || continue
            dono=$(gh issue view "$n" --json comments \
              --jq '[.comments[].body | select(startswith("anchors-owner:"))] | last')
            # O ESTADO ATUAL só para o registro: quem lê o card precisa saber onde ele
            # ficou, e a mensagem sem isso obriga a conferir as labels.
            estado_atual=$(gh issue view "$n" --json labels --jq '.labels[].name' |
              grep -E '^anchors:(to-do|in-progress|in-review|in-test)$' | head -1 || true)

            # O STALE LIBERA O DONO. NÃO MOVE O CARD.
            #
            # A versão anterior decidia um destino pela label anterior: `in-review` voltava
            # para `ready-to-review`, e todo o resto para `to-do`. O raciocínio do primeiro
            # caso estava certo e escrito no próprio código — "mandar para `to-do` faria o
            # próximo agente REIMPLEMENTAR o que já existe".
            #
            # O SEGUNDO CASO PRESUMIA o que não conferia. A justificativa dizia "aqui o
            # trabalho NÃO terminou: não há PR, ou os checks não passaram" — mas nada
            # olhava se havia PR. Quando havia, e verde, a presunção estava errada e o
            # efeito era exatamente o que o comentário condenava três linhas acima.
            #
            # Mover é uma decisão a mais, tomada sem os dados que a justificariam. Liberar
            # o dono BASTA: o `claim` serve por estado E por dono liberado, e um card em
            # `in-progress` sem dono é legível — alguém começou e sumiu. O board passa a
            # dizer isso em vez de apagar a passagem.
            #
            # O QUE SE PERDE: o card não volta para a fila de quem filtra por `to-do`. É o
            # preço de não mentir sobre onde o trabalho está, e o `claim` não precisa disso.
            gh issue comment "$n" --body "anchors-owner: (liberado) — sem progresso desde ${limite}; dono anterior: ${dono#anchors-owner: }; o card fica em \`${estado_atual#anchors:}\`, e o próximo \`claim\` pode pegá-lo"

            echo "liberado: #$n (era de ${dono#anchors-owner: }) — fica em ${estado_atual#anchors:}"
          done
