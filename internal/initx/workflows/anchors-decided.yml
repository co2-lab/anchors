# anchors:template — gerado pelo `anchors`. Enquanto esta linha e o conteúdo abaixo
# não forem editados, `anchors doctor --fix` mantém o arquivo atualizado. Ao editar,
# REMOVA esta linha: é o que diz ao Anchors que o pipeline passou a ser seu, e o `--fix`
# para de tocá-lo (passa a avisar quando o padrão mudar, sem sobrescrever).
# Anchors — o DESBLOQUEIO ENTREGUE devolve o card à fila
#
# Um card em `anchors:needs-user` espera uma pessoa, e há DOIS jeitos de ele voltar à fila:
#
#   · a decisão é simples — alguém responde, e `anchors decided --card N --resolution "..."`
#     remove a label. É comando, não pipeline: a `--resolution` é obrigatória, e uma decisão
#     que libera o card sem dizer qual REGRA nasceu dela fica sem rastro.
#
#   · a decisão GEROU TRABALHO — e aí `anchors unblock` criou um card com
#     `anchors:desbloqueia-<n>`. Enquanto ele estiver aberto, o `decided` RECUSA liberar:
#     o card voltaria à fila e quem o pegasse encontraria o trabalho ainda por fazer.
#
# ESTE PIPELINE CUIDA DO SEGUNDO CASO, e só dele: quando o card de desbloqueio FECHA,
# ninguém está olhando. Não há comentário no card bloqueado, não há evento nele, e a pessoa
# que decidiu já seguiu para outra coisa — ela teria de lembrar de voltar e rodar o
# `decided` de novo.
#
# Medido: o card #311 do projeto de referência teve o defeito consertado e continuou parado.
# A condição escrita na instrução ("decida, e depois remova a label") tinha sido cumprida, e
# a label ficou — ninguém era responsável por tirá-la.
#
# O QUE ELE NÃO FAZ: não interpreta comentário, não procura tag, não decide nada. Se a
# decisão não gerou card de desbloqueio, este pipeline não tem o que fazer — e quem libera é
# o `anchors decided`, com a resolução na mão.
name: anchors · desbloqueio entregue

on:
  # O FECHAMENTO do card de desbloqueio é o gatilho natural: é o fato que destrava.
  issues:
    types: [closed]
  # E o cron como rede: uma issue fechada pela API fora do fluxo, um evento perdido, um
  # card cujo desbloqueio já estava fechado quando a label foi posta.
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: anchors-decided
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  destravar:
    runs-on: ubuntu-latest
    steps:
      - name: Devolver à fila os cards cuja decisão saiu
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          LABEL: anchors
        run: |
          set -euo pipefail

          # TODOS os cards escalados, e não só o do evento: o `schedule` precisa varrer, e
          # varrer sempre custa uma chamada a mais num conjunto que é pequeno por natureza
          # (um card escalado é exceção, não regra).
          escalados=$(gh issue list --repo "$GH_REPO" --state open \
            --label "$LABEL" --label "anchors:needs-user" --limit 100 \
            --json number --jq '.[].number')

          if [ -z "$escalados" ]; then
            echo "nenhum card escalado — nada a fazer"
            exit 0
          fi

          for n in $escalados; do
            # ESTE CARD ESPERA UM DESBLOQUEIO? Se não tem nenhum, não é caso deste
            # pipeline: ele espera uma PESSOA, e quem o libera é o `anchors decided` —
            # com a resolução, que este pipeline não tem como inventar.
            todos=$(gh issue list --repo "$GH_REPO" --state all \
              --label "anchors:desbloqueia-$n" --limit 20 \
              --json number --jq '[.[].number] | length' 2>/dev/null || echo 0)
            if [ "$todos" = "0" ]; then
              continue
            fi

            # ALGUM ainda está ABERTO? Então o trabalho não terminou.
            abertos=$(gh issue list --repo "$GH_REPO" --state open \
              --label "anchors:desbloqueia-$n" --limit 20 \
              --json number --jq '[.[].number] | join(", #")' 2>/dev/null || echo "")
            if [ -n "$abertos" ]; then
              echo "· #$n ainda espera a entrega de #$abertos — label MANTIDA"
              continue
            fi

            gh issue edit "$n" --repo "$GH_REPO" \
              --remove-label "anchors:needs-user" >/dev/null

            # O COMENTÁRIO diz POR QUE a label saiu. Uma label que some sozinha, sem rastro,
            # faz quem acompanha suspeitar do pipeline em vez de confiar nele.
            gh issue comment "$n" --repo "$GH_REPO" --body \
              "▶️ **De volta à fila.** Todos os cards de desbloqueio deste card foram entregues.

            A decisão que parou este card gerou trabalho, o trabalho terminou, e a label \`anchors:needs-user\` foi removida por este pipeline — o claim volta a entregar este card." >/dev/null

            echo "· #$n DESTRAVADO — os $todos card(s) de desbloqueio foram entregues"
          done
