flow:
    states:
        - code: ACAUD-R01
          title: 'HÁ PENDÊNCIA: o dossiê lista o que está aberto'
          flow: flows/actions/audit.action.md
        - code: ACAUD-R02
          title: 'NADA ABERTO: o arquivo não tem pendência'
          flow: flows/actions/audit.action.md
        - code: ACHCK-R01
          title: 'PROMOVÍVEL: nenhum gate bloqueante reprovou'
          flow: flows/actions/check.action.md
        - code: ACHCK-R02
          title: 'BARRADO: um gate bloqueante reprovou'
          flow: flows/actions/check.action.md
          suggests: corrigir o que o veredito aponta, ou declarar a dispensa com razão escrita.
        - code: ACHCK-R03
          title: 'JULGAMENTO PENDENTE: há gate que nenhum script computa'
          flow: flows/actions/check.action.md
        - code: ACHCK-R04
          title: 'FORA DA ESTRUTURA: o alvo não casa camada nenhuma'
          flow: flows/actions/check.action.md
        - code: ACHCK-R05
          title: 'MAPA DESATUALIZADO: o mapa é mais velho que os arquivos'
          flow: flows/actions/check.action.md
          suggests: '`anchors map build`, e confrontar de novo.'
        - code: ACCIP-R01
          title: 'PR VERDE: compila, testa, e os gates passam'
          flow: flows/actions/ci.action.md
        - code: ACCIP-R02
          title: 'MAPA VELHO: o mapa não reflete o que o PR traz'
          flow: flows/actions/ci.action.md
          suggests: '`anchors map build`, e commitar o mapa junto.'
        - code: ACCIP-R03
          title: 'GATE REPROVOU: um bloqueante falhou no confronto completo'
          flow: flows/actions/ci.action.md
        - code: ACCIP-R04
          title: 'ISSUE PARA TRÁS: o check abriu achado que o PR não fechou'
          flow: flows/actions/ci.action.md
          suggests: tratar o que ficou, ou declarar por que fica.
        - code: ACDEC-R01
          title: 'CARD LIBERADO: volta à fila com a resolução escrita'
          flow: flows/actions/decided.action.md
        - code: ACDIS-R01
          title: 'CARD DESCARTADO: fora do quadro, com a razão registrada'
          flow: flows/actions/discard.action.md
        - code: ACDON-R01
          title: 'FECHADA: a tarefa foi para o histórico'
          flow: flows/actions/done.action.md
        - code: ACDON-R02
          title: 'SEM ID: a ação não sabe o que fechar'
          flow: flows/actions/done.action.md
        - code: ACESC-R01
          title: 'CARD COMUM: não impacta a direção'
          flow: flows/actions/escalate.action.md
        - code: ACESC-R02
          title: 'AGUARDANDO O USUÁRIO: impacta a direção'
          flow: flows/actions/escalate.action.md
        - code: ACESC-R03
          title: 'AGUARDANDO ENQUADRAMENTO: não se sabe se impacta'
          flow: flows/actions/escalate.action.md
        - code: ACGPJ-R01
          title: 'DESCOBERTA FEITA: PROJECT.md e INSIGHTS.md escritos'
          flow: flows/actions/guide-project.action.md
        - code: ACGDE-R01
          title: 'RÉGUA LIDA: quem vai escrever sabe o critério'
          flow: flows/actions/guide.action.md
        - code: ACGDE-R02
          title: 'GUIA SEM PONTOS DE CONFORMIDADE: só há prosa a interpretar'
          flow: flows/actions/guide.action.md
        - code: ACINI-R01
          title: 'ESTRUTURA INFERIDA: o projeto tem código e o disco respondeu'
          flow: flows/actions/init.action.md
        - code: ACINI-R02
          title: 'DIRETÓRIO VAZIO: não há de onde inferir'
          flow: flows/actions/init.action.md
        - code: ACJPN-R01
          title: 'HÁ ALVO AGUARDANDO: o guia e a pergunta vêm junto'
          flow: flows/actions/judge-pending.action.md
        - code: ACJPN-R02
          title: 'NADA AGUARDANDO: nenhum gate de julgamento pendente'
          flow: flows/actions/judge-pending.action.md
        - code: ACJVD-R01
          title: 'APROVADO: o alvo cumpre os pontos de conformidade'
          flow: flows/actions/judge-verdict.action.md
        - code: ACJVD-R02
          title: 'REPROVADO: o alvo viola um ou mais pontos'
          flow: flows/actions/judge-verdict.action.md
        - code: ACJVD-R03
          title: 'DISPENSADO: o ponto não se aplica a este alvo'
          flow: flows/actions/judge-verdict.action.md
        - code: ACMAP-R01
          title: 'MAPA EM DIA: o grafo reflete o disco'
          flow: flows/actions/map-build.action.md
        - code: ACMAP-R02
          title: 'CARIMBO PERDIDO: o rebuild não achou um nó que tinha validação'
          flow: flows/actions/map-build.action.md
        - code: ACNPL-R01
          title: 'PLANO SEMEADO: o arquivo existe e a esteira partiu'
          flow: flows/actions/new-plan.action.md
        - code: ACNXT-R01
          title: 'TAREFA PUXADA: reivindicada, e é só desta sessão'
          flow: flows/actions/next.action.md
        - code: ACNXT-R02
          title: 'FILA VAZIA: não há trabalho pendente'
          flow: flows/actions/next.action.md
        - code: ACPRC-R01
          title: 'COMMIT PASSOU: nenhum bloqueante vermelho'
          flow: flows/actions/pre-commit.action.md
        - code: ACPRC-R02
          title: 'BARRADO POR GATE: um bloqueante reprovou no que está em stage'
          flow: flows/actions/pre-commit.action.md
          suggests: 'corrigir, ou declarar a dispensa na mensagem do commit com `[skip-<regra>@<CÓDIGO>: por quê]`.'
        - code: ACPRC-R03
          title: 'BARRADO POR FALTA DE MAPA: arquivo REGIDO e fora do mapa'
          flow: flows/actions/pre-commit.action.md
          suggests: '`anchors map build`, e commitar de novo.'
        - code: ACPRC-R04
          title: 'IGNORADO: arquivo não regido pela Estrutura'
          flow: flows/actions/pre-commit.action.md
        - code: ACRCL-R01
          title: 'TAREFAS DEVOLVIDAS: a fila volta a alcançá-las'
          flow: flows/actions/reclaim.action.md
        - code: ACRCL-R02
          title: 'NADA PRESO: nenhuma reivindicação órfã'
          flow: flows/actions/reclaim.action.md
        - code: ACREL-R01
          title: 'PUBLICADO: os binários estão disponíveis'
          flow: flows/actions/release.action.md
        - code: ACREL-R02
          title: 'FALHOU: o build da release quebrou'
          flow: flows/actions/release.action.md
        - code: ACUNB-R01
          title: 'CARD DE DESBLOQUEIO ABERTO: o bloqueado espera trabalho, não pessoa'
          flow: flows/actions/unblock.action.md
        - code: ACWCH-R01
          title: 'VIGIA NO AR: as mudanças viram tarefa'
          flow: flows/actions/watch-start.action.md
        - code: ACWCH-R02
          title: 'JÁ ESTAVA RODANDO: nada a fazer'
