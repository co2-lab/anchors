name: Release CLI

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod

      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
          workdir: cli
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          WINGET_GITHUB_TOKEN: ${{ secrets.WINGET_GITHUB_TOKEN }}

  # ── Winget ─────────────────────────────────────────────────────────────────
  # Job SEPARADO, e não uma seção do goreleaser: publicar no Winget exige sincronizar o
  # fork com o upstream da Microsoft, e o goreleaser faz isso por `merge-upstream` — uma
  # API que PAT fine-grained não acessa (medido na v0.1.0: 403, e a release inteira caiu
  # junto, levando o Scoop que ainda não tinha rodado).
  #
  # A `winget-releaser` é a ferramenta especializada nisso, e já é a que publica o Polvo.
  # `needs: goreleaser` porque ela lê os binários DA release — que precisa existir antes.
  publicar-winget:
    name: Publicar no Winget
    needs: goreleaser
    runs-on: ubuntu-latest
    # NÃO derruba a release. Enquanto o pacote não existir no `winget-pkgs`, a action
    # recusa com "Package does not exist — add at least one version before using this
    # action": ela ATUALIZA um pacote publicado, e o primeiro envio é um PR manual que a
    # Microsoft revisa (microsoft/winget-pkgs#425738, aberto e com validação passada).
    #
    # É ovo e galinha do primeiro lançamento, e não defeito nosso. Sem isto, TODA release
    # fica vermelha por um job que se sabe que vai falhar — e um vermelho que se aprende a
    # ignorar deixa de sinalizar quando algo real quebrar.
    continue-on-error: true
    # O token ambiente não é usado por este job (a action recebe o PAT explicitamente),
    # então não há motivo para ele carregar permissão nenhuma sobre este repositório.
    permissions: {}
    steps:
      # SHA fixo, não `@v2`: a action recebe um PAT CLÁSSICO, que tem poder amplo sobre
      # os repositórios da organização. Uma tag é móvel — quem controlasse a action
      # poderia trocar o código sob esse token sem que nada aqui mudasse.
      - uses: vedantmgoyal9/winget-releaser@4ffc7888bffd451b357355dc214d43bb9f23917e # v2
        with:
          identifier: co2lab.Anchors
          # PAT CLÁSSICO: o fine-grained não serve para operações de fork.
          token: ${{ secrets.WINGET_GITHUB_TOKEN }}
          release-tag: ${{ github.ref_name }}
          fork-user: co2-lab
          installers-regex: '_windows_\w+\.zip$'
