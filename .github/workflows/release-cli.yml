name: Release CLI

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod

      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
          workdir: cli
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          WINGET_GITHUB_TOKEN: ${{ secrets.WINGET_GITHUB_TOKEN }}

  # ── Winget ─────────────────────────────────────────────────────────────────
  # Job SEPARADO, e não uma seção do goreleaser: publicar no Winget exige sincronizar o
  # fork com o upstream da Microsoft, e o goreleaser faz isso por `merge-upstream` — uma
  # API que PAT fine-grained não acessa (medido na v0.1.0: 403, e a release inteira caiu
  # junto, levando o Scoop que ainda não tinha rodado).
  #
  # A `winget-releaser` é a ferramenta especializada nisso, e já é a que publica o Polvo.
  # `needs: goreleaser` porque ela lê os binários DA release — que precisa existir antes.
  publicar-winget:
    name: Publicar no Winget
    needs: goreleaser
    runs-on: ubuntu-latest

    # O token ambiente não é usado por este job (a action recebe o PAT explicitamente),
    # então não há motivo para ele carregar permissão nenhuma sobre este repositório.
    permissions: {}
    steps:
      # O PACOTE JÁ EXISTE no winget-pkgs?
      #
      # A action ATUALIZA um pacote publicado — ela recusa com "Package does not exist"
      # enquanto o primeiro envio (um PR manual que a Microsoft revisa) não entrar. É ovo
      # e galinha do primeiro lançamento, e não defeito nosso.
      #
      # Verificar ANTES em vez de `continue-on-error`: aquele engoliria também a falha
      # REAL — um PAT expirado, o upstream fora do ar — e a release passaria a mentir que
      # publicou. Aqui a distinção fica explícita: "ainda não dá" pula com aviso, e
      # qualquer outro erro derruba o job, como deve.
      - id: existe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # O manifesto vive num caminho derivado do identificador:
          # manifests/<inicial>/<Publisher>/<Package>/
          caminho="manifests/c/co2lab/Anchors"
          if gh api "repos/microsoft/winget-pkgs/contents/$caminho" --jq '.[0].name' >/dev/null 2>&1; then
            echo "publicado=true" >> "$GITHUB_OUTPUT"
          else
            echo "publicado=false" >> "$GITHUB_OUTPUT"
            echo "::notice::O pacote ainda não está no winget-pkgs — o primeiro envio é um PR manual que a Microsoft revisa. Publicação no Winget PULADA (as demais plataformas seguem)."
          fi

      # SHA fixo, não `@v2`: a action recebe um PAT CLÁSSICO, que tem poder amplo sobre
      # os repositórios da organização. Uma tag é móvel — quem controlasse a action
      # poderia trocar o código sob esse token sem que nada aqui mudasse.
      - if: steps.existe.outputs.publicado == 'true'
        uses: vedantmgoyal9/winget-releaser@4ffc7888bffd451b357355dc214d43bb9f23917e # v2
        with:
          identifier: co2lab.Anchors
          # PAT CLÁSSICO: o fine-grained não serve para operações de fork.
          token: ${{ secrets.WINGET_GITHUB_TOKEN }}
          release-tag: ${{ github.ref_name }}
          fork-user: co2-lab
          installers-regex: '_windows_\w+\.zip$'
