# Anchors — pipeline de CLAIM (atribuição de trabalho)
#
# Existe para que a concorrência não exista. Se cada agente reivindicasse o card
# diretamente, dois deles poderiam ler "sem dono" antes de qualquer um escrever, e ambos
# se achariam donos — a API do GitHub não oferece compare-and-swap, então nenhum protocolo
# em que os agentes DISPUTAM fecha essa janela.
#
# Aqui eles não disputam: PEDEM. Como este workflow é serializado, "há card livre?" e
# "atribua a ele" acontecem sem ninguém no meio.
#
# O dono não é o `assignee`: aquele campo responde "qual PESSOA é responsável", e dois
# agentes na mesma máquina têm o mesmo usuário do GitHub. O dono-agente vive num
# comentário `anchors-owner: <maquina>/<sessao>` — comentários têm `created_at`, então a
# ordem é contratual, e o histórico de quem passou pelo card fica registrado com data.
# anchors:template — gerado pelo `anchors`. Enquanto esta linha e o conteúdo abaixo
# não forem editados, `anchors doctor --fix` mantém o arquivo atualizado. Ao editar,
# REMOVA esta linha: é o que diz ao Anchors que o pipeline passou a ser seu, e o `--fix`
# para de tocá-lo (passa a avisar quando o padrão mudar, sem sobrescrever).
name: anchors · atribuir trabalho

on:
  workflow_dispatch:
    inputs:
      agent:
        description: "identidade do agente: <maquina>/<sessao>"
        required: true
        type: string

# A serialização é o mecanismo inteiro. Sem isto, duas execuções atribuiriam o mesmo card
# a dois agentes — exatamente o que este pipeline existe para impedir.
concurrency:
  group: anchors-claim
  cancel-in-progress: false

# Só o que o GITHUB_TOKEN da própria Action já dá. Nada a configurar: o estado do
# trabalho é uma LABEL, e escrever label é permissão nativa de `issues: write`.
permissions:
  contents: read
  issues: write

jobs:
  atribuir:
    runs-on: ubuntu-latest
    steps:
      - name: Escolher um card livre e atribuí-lo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Sem `actions/checkout` (não precisamos do código), o `gh` não descobre o
          # repositório pelo git local — `GH_REPO` é o que o diz.
          GH_REPO: ${{ github.repository }}
          AGENT: ${{ inputs.agent }}
          LABEL: anchors
        run: |
          set -euo pipefail

          # O CARD DO PRÓPRIO AGENTE VEM PRIMEIRO — antes da prioridade do board.
          #
          # Um agente por vez, um card por vez: dois cards abertos no mesmo agente
          # significam um deles parado sem ninguém olhando. Mas a conclusão daqui era
          # abortar com "nada a atribuir", e isso devolvia o agente de mãos vazias
          # justamente quando ele TINHA trabalho — um card que ele pegou e que voltou a
          # `to-do` (pelo stale, ou porque a sessão anterior parou no meio) continua sendo
          # dele, com o contexto já construído.
          #
          # Retomar o próprio trabalho vence a prioridade do board: o `ready-to-review`
          # mais adiantado é de outra pessoa, e mandar este agente para lá abandonaria o
          # que ele já começou — que é exatamente o trabalho pela metade que a regra de
          # prioridade existe para evitar.
          # Só os estados DA ALÇADA DO AGENTE. A busca olhava apenas o dono, e o dono
          # continua registrado depois que o trabalho termina — um card aprovado e movido
          # para `ready-to-test` era retomado e REGREDIA para `in-progress`, desfazendo a
          # aprovação. Medido no primeiro uso: o card #1 voltou de `ready-to-test` para
          # `in-progress` no claim seguinte.
          #
          # De `ready-to-test` em diante quem move são os pipelines de entrega do projeto,
          # e o agente não tem mais o que fazer ali.
          meu=$(gh issue list --state open --label "$LABEL" --limit 200 \
            --json number,comments,labels \
            --jq "[.[]
                   | select([.labels[].name] | any(. == \"anchors:to-do\" or . == \"anchors:in-progress\"
                             or . == \"anchors:ready-to-review\" or . == \"anchors:in-review\"))
                   | select([.comments[].body | select(startswith(\"anchors-owner:\"))] | last == \"anchors-owner: $AGENT\")]
                  | .[0].number // empty")

          # Os candidatos vêm das LABELS de estado — o board não é consultado, e nem
          # precisa existir. A PRIORIDADE É DA DIREITA PARA A ESQUERDA DO FLUXO: o
          # trabalho mais adiantado vem primeiro. Terminar o que está quase pronto antes
          # de começar coisa nova é o que impede o board de encher de trabalho pela
          # metade — e trabalho pela metade não entrega nada, ocupa revisor, e envelhece
          # até o contexto de quem o escreveu se perder.
          : > /tmp/disponiveis.txt
          for estado in "anchors:ready-to-review" "anchors:to-do"; do
            gh issue list --state open --label "$LABEL" --label "$estado" \
              --limit 200 --json number --jq '.[].number' >> /tmp/disponiveis.txt
          done

          # Entre os disponíveis, o LIVRE é o que ninguém tem: nunca teve `anchors-owner`,
          # ou o último o liberou. A ordem de /tmp/disponiveis.txt é a prioridade (review
          # antes de implementação).
          livre=""
          while read -r n; do
            [ -n "$n" ] || continue
            dono=$(gh issue view "$n" --json comments \
              --jq '[.comments[].body | select(startswith("anchors-owner:"))] | last // ""')
            # O coringa no FIM é necessário: o pipeline de stale escreve o motivo depois
            # do marcador (`anchors-owner: (liberado) — sem progresso desde …`), e sem ele
            # o padrão exigiria que a linha TERMINASSE em "(liberado)" — nenhum card
            # liberado voltaria à fila, e o board travaria em silêncio.
            case "$dono" in
              ""|*"(liberado)"*) livre="$n"; break ;;
            esac
          done < /tmp/disponiveis.txt

          # O próprio card vence o que a varredura achou: ele foi procurado primeiro e só
          # não interrompeu o fluxo para que a mensagem final saiba distinguir "retomei o
          # meu" de "peguei um novo".
          retomado=""
          if [ -n "$meu" ]; then
            livre="$meu"; retomado="sim"
          fi

          if [ -z "$livre" ]; then
            echo "nenhum card livre"
            exit 0
          fi

          # A atribuição. O comentário é a posse; o assignee fica para a pessoa, no uso
          # normal do GitHub.
          gh issue comment "$livre" --body "anchors-owner: $AGENT"
          # Cada `ready-to-x` tem seu `in-x`: quem sai de `to-do` vai implementar, quem
          # sai de `ready-to-review` vai revisar. Mover para o estado errado faria o
          # board descrever um trabalho que não é o que está acontecendo.
          # `--jq index(...)` devolve VAZIO quando não acha (o gh engole o `null`), e
          # testar vazio com grep se comporta de forma imprevisível — foi assim que um
          # card em `to-do` foi movido para `in-review` na primeira execução real.
          # Listar as labels e procurar a linha exata não tem essa ambiguidade.
          labels_atuais=$(gh issue view "$livre" --json labels --jq '.labels[].name')
          if echo "$labels_atuais" | grep -qx "anchors:ready-to-review"; then
            de="anchors:ready-to-review"; para="anchors:in-review"
          elif echo "$labels_atuais" | grep -qx "anchors:in-review"; then
            # RETOMADA de um card que já estava em revisão: o estado não regride. Sem
            # este ramo o card cairia no `else` e voltaria para `in-progress` — o board
            # passaria a descrever implementação onde há revisão em curso.
            de="anchors:in-review"; para="anchors:in-review"
          elif echo "$labels_atuais" | grep -qx "anchors:in-progress"; then
            de="anchors:in-progress"; para="anchors:in-progress"
          else
            de="anchors:to-do"; para="anchors:in-progress"
          fi
          # Remove TODOS os estados, e não só o `$de` detectado: o estado é a label, e um
          # card que por qualquer motivo carregue dois estados manteria o outro colado
          # aqui. A remoção parcial não apenas falha em limpar — ela PERPETUA o estado
          # duplicado, porque cada transição seguinte também só remove um.
          #
          # A remoção e a adição vão em CHAMADAS SEPARADAS, e a remoção pula o estado de
          # destino: numa retomada `de == para`, e o `gh issue edit` que remove e adiciona
          # a MESMA label na mesma chamada aplica a remoção — o card ficava sem estado
          # nenhum, só com a label do Anchors. Medido no primeiro uso real da retomada.
          for e in anchors:to-do anchors:in-progress anchors:ready-to-review \
                   anchors:in-review anchors:ready-to-test anchors:in-test \
                   anchors:ready-to-release anchors:production; do
            [ "$e" = "$para" ] && continue
            gh issue edit "$livre" --remove-label "$e" >/dev/null 2>&1 || true
          done
          gh issue edit "$livre" --add-label "$para"

          if [ -n "$retomado" ]; then
            echo "card #$livre RETOMADO por $AGENT (já era dele): $de → $para"
          else
            echo "card #$livre atribuído a $AGENT: $de → $para"
          fi
