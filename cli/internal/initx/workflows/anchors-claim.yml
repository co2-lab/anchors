# Anchors — pipeline de CLAIM (atribuição de trabalho)
#
# Existe para que a concorrência não exista. Se cada agente reivindicasse o card
# diretamente, dois deles poderiam ler "sem dono" antes de qualquer um escrever, e ambos
# se achariam donos — a API do GitHub não oferece compare-and-swap, então nenhum protocolo
# em que os agentes DISPUTAM fecha essa janela.
#
# Aqui eles não disputam: PEDEM. Como este workflow é serializado, "há card livre?" e
# "atribua a ele" acontecem sem ninguém no meio.
#
# O dono não é o `assignee`: aquele campo responde "qual PESSOA é responsável", e dois
# agentes na mesma máquina têm o mesmo usuário do GitHub. O dono-agente vive num
# comentário `anchors-owner: <maquina>/<sessao>` — comentários têm `created_at`, então a
# ordem é contratual, e o histórico de quem passou pelo card fica registrado com data.
name: anchors · atribuir trabalho

on:
  workflow_dispatch:
    inputs:
      agent:
        description: "identidade do agente: <maquina>/<sessao>"
        required: true
        type: string

# A serialização é o mecanismo inteiro. Sem isto, duas execuções atribuiriam o mesmo card
# a dois agentes — exatamente o que este pipeline existe para impedir.
concurrency:
  group: anchors-claim
  cancel-in-progress: false

permissions:
  contents: read
  issues: write
  # O estado do trabalho é a COLUNA do Project, não uma label — então este workflow
  # precisa escrever no board. Num Project de organização, o GITHUB_TOKEN não basta:
  # use um PAT com escopo `project` em `secrets.ANCHORS_PROJECT_TOKEN`.
  repository-projects: write

jobs:
  atribuir:
    runs-on: ubuntu-latest
    steps:
      - name: Escolher um card livre e atribuí-lo
        env:
          GH_TOKEN: ${{ secrets.ANCHORS_PROJECT_TOKEN || secrets.GITHUB_TOKEN }}
          AGENT: ${{ inputs.agent }}
          LABEL: anchors
          # O número do Project no owner (github.com/orgs/<owner>/projects/<N>).
          PROJECT: ${{ vars.ANCHORS_PROJECT_NUMBER }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail

          # Um agente por vez, um card por vez: se este agente já tem trabalho, não recebe
          # outro. Dois cards abertos no mesmo agente significam um deles parado sem
          # ninguém olhando.
          ja_tem=$(gh issue list --state open --label "$LABEL" --limit 200 \
            --json number,comments \
            --jq "[.[] | select([.comments[].body | select(startswith(\"anchors-owner:\"))] | last == \"anchors-owner: $AGENT\")] | length")
          if [ "$ja_tem" -gt 0 ]; then
            echo "o agente $AGENT já tem card em andamento — nada a atribuir"
            exit 0
          fi

          # Os candidatos vêm das colunas `READY TO ...` do board — o estado é a coluna
          # (BOOTSTRAP.md §7.13). O par `READY TO X` / `IN X` é o que torna a fila
          # legível: `READY TO` é trabalho disponível, `IN` é alguém fazendo.
          #
          # A PRIORIDADE É DA DIREITA PARA A ESQUERDA DO BOARD: o trabalho mais adiantado
          # vem primeiro. Terminar o que está quase pronto antes de começar coisa nova é o
          # que impede o board de encher de trabalho pela metade — e trabalho pela metade
          # não entrega nada, ocupa revisor, e envelhece até o contexto de quem o escreveu
          # se perder. Daí `READY TO REVIEW` antes de `TO DO`.
          gh project item-list "$PROJECT" --owner "$OWNER" --limit 500 --format json \
            > /tmp/board.json

          # O board é COMPARTILHADO: ele carrega issues de produto, de infraestrutura, do
          # que o time quiser. Só os cards do Anchors podem ser tocados por este fluxo —
          # sem este filtro, um agente comentaria `anchors-owner` numa issue de produto e
          # a moveria para `IN PROGRESS`, sequestrando trabalho que não é dele.
          #
          # A label do `workflow.labels` é o que marca a posse do fluxo (WORKFLOW.md §2).
          gh issue list --state open --label "$LABEL" --limit 500 --json number \
            --jq '.[].number' | sort -u > /tmp/sao-do-anchors.txt

          jq -r '[.items[] | select(.status == "READY TO REVIEW") | .content.number] | .[]' \
            /tmp/board.json | grep -xFf /tmp/sao-do-anchors.txt > /tmp/disponiveis.txt || true
          jq -r '[.items[] | select(.status == "TO DO") | .content.number] | .[]' \
            /tmp/board.json | grep -xFf /tmp/sao-do-anchors.txt >> /tmp/disponiveis.txt || true

          # Entre os da coluna, o LIVRE é o que ninguém tem: nunca teve `anchors-owner`,
          # ou o último o liberou. Ordem de criação — o mais antigo primeiro, para que
          # nada envelheça no fundo da fila.
          # Entre os disponíveis, o LIVRE é o que ninguém tem: nunca teve `anchors-owner`,
          # ou o último o liberou. A ordem de /tmp/disponiveis.txt é a prioridade (review
          # antes de implementação).
          livre=""
          while read -r n; do
            [ -n "$n" ] || continue
            dono=$(gh issue view "$n" --json comments \
              --jq '[.comments[].body | select(startswith("anchors-owner:"))] | last // ""')
            case "$dono" in
              ""|*"(liberado)") livre="$n"; break ;;
            esac
          done < /tmp/disponiveis.txt

          if [ -z "$livre" ]; then
            echo "nenhum card livre"
            exit 0
          fi

          # A atribuição. O comentário é a posse; o assignee fica para a pessoa, no uso
          # normal do GitHub.
          gh issue comment "$livre" --body "anchors-owner: $AGENT"

          # A COLUNA é o estado (ver BOOTSTRAP.md §7.13). O item do Project e o campo
          # `Status` são achados pelo número da issue; mover é setar o valor do campo.
          item=$(gh project item-list "$PROJECT" --owner "$OWNER" --format json \
            --jq ".items[] | select(.content.number == $livre) | .id")
          if [ -z "$item" ]; then
            echo "::error::a issue #$livre não está no Project $PROJECT — o board é a fonte do estado."
            exit 1
          fi
          # Cada `READY TO X` tem seu `IN X`: quem sai de `TO DO` vai implementar, quem
          # sai de `READY TO REVIEW` vai revisar. Mover para a coluna errada faria o board
          # descrever um trabalho que não é o que está acontecendo.
          origem=$(jq -r --argjson n "$livre" \
            '.items[] | select(.content.number == $n) | .status' /tmp/board.json)
          case "$origem" in
            "READY TO REVIEW") destino="IN REVIEW" ;;
            *)                 destino="IN PROGRESS" ;;
          esac

          campo=$(gh project field-list "$PROJECT" --owner "$OWNER" --format json \
            --jq '.fields[] | select(.name == "Status")')
          gh project item-edit \
            --id "$item" \
            --project-id "$(gh project view "$PROJECT" --owner "$OWNER" --format json --jq .id)" \
            --field-id "$(echo "$campo" | jq -r .id)" \
            --single-select-option-id "$(echo "$campo" | jq -r --arg d "$destino" '.options[] | select(.name == $d) | .id')"

          echo "card #$livre atribuído a $AGENT: $origem → $destino"
