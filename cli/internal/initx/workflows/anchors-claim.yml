# Anchors — pipeline de CLAIM (atribuição de trabalho)
#
# Existe para que a concorrência não exista. Se cada agente reivindicasse o card
# diretamente, dois deles poderiam ler "sem dono" antes de qualquer um escrever, e ambos
# se achariam donos — a API do GitHub não oferece compare-and-swap, então nenhum protocolo
# em que os agentes DISPUTAM fecha essa janela.
#
# Aqui eles não disputam: PEDEM. Como este workflow é serializado, "há card livre?" e
# "atribua a ele" acontecem sem ninguém no meio.
#
# O dono não é o `assignee`: aquele campo responde "qual PESSOA é responsável", e dois
# agentes na mesma máquina têm o mesmo usuário do GitHub. O dono-agente vive num
# comentário `anchors-owner: <maquina>/<sessao>` — comentários têm `created_at`, então a
# ordem é contratual, e o histórico de quem passou pelo card fica registrado com data.
# anchors:template — gerado pelo `anchors`. Enquanto esta linha e o conteúdo abaixo
# não forem editados, `anchors doctor --fix` mantém o arquivo atualizado. Ao editar,
# REMOVA esta linha: é o que diz ao Anchors que o pipeline passou a ser seu, e o `--fix`
# para de tocá-lo (passa a avisar quando o padrão mudar, sem sobrescrever).
name: anchors · atribuir trabalho

on:
  workflow_dispatch:
    inputs:
      agent:
        description: "identidade do agente: <maquina>/<sessao>"
        required: true
        type: string

# A serialização é o mecanismo inteiro. Sem isto, duas execuções atribuiriam o mesmo card
# a dois agentes — exatamente o que este pipeline existe para impedir.
concurrency:
  group: anchors-claim
  cancel-in-progress: false

# Só o que o GITHUB_TOKEN da própria Action já dá. Nada a configurar: o estado do
# trabalho é uma LABEL, e escrever label é permissão nativa de `issues: write`.
permissions:
  contents: read
  issues: write

jobs:
  atribuir:
    runs-on: ubuntu-latest
    steps:
      - name: Escolher um card livre e atribuí-lo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Sem `actions/checkout` (não precisamos do código), o `gh` não descobre o
          # repositório pelo git local — `GH_REPO` é o que o diz.
          GH_REPO: ${{ github.repository }}
          AGENT: ${{ inputs.agent }}
          LABEL: anchors
        run: |
          set -euo pipefail

          # O CARD DO PRÓPRIO AGENTE VEM PRIMEIRO — antes da prioridade do board.
          #
          # Um agente por vez, um card por vez: dois cards abertos no mesmo agente
          # significam um deles parado sem ninguém olhando. Mas a conclusão daqui era
          # abortar com "nada a atribuir", e isso devolvia o agente de mãos vazias
          # justamente quando ele TINHA trabalho — um card que ele pegou e que voltou a
          # `to-do` (pelo stale, ou porque a sessão anterior parou no meio) continua sendo
          # dele, com o contexto já construído.
          #
          # Retomar o próprio trabalho vence a prioridade do board: o `ready-to-review`
          # mais adiantado é de outra pessoa, e mandar este agente para lá abandonaria o
          # que ele já começou — que é exatamente o trabalho pela metade que a regra de
          # prioridade existe para evitar.
          # Só os estados DA ALÇADA DO AGENTE. A busca olhava apenas o dono, e o dono
          # continua registrado depois que o trabalho termina — um card aprovado e movido
          # para `ready-to-test` era retomado e REGREDIA para `in-progress`, desfazendo a
          # aprovação. Medido no primeiro uso: o card #1 voltou de `ready-to-test` para
          # `in-progress` no claim seguinte.
          #
          # De `ready-to-test` em diante quem move são os pipelines de entrega do projeto,
          # e o agente não tem mais o que fazer ali.
          meu=$(gh issue list --state open --label "$LABEL" --limit 200 \
            --json number,comments,labels \
            --jq "[.[]
                   | select([.labels[].name] | any(. == \"anchors:to-do\" or . == \"anchors:in-progress\"
                             or . == \"anchors:ready-to-review\" or . == \"anchors:in-review\"))
                   | select([.comments[].body | select(startswith(\"anchors-owner:\"))] | last == \"anchors-owner: $AGENT\")]
                  | .[0].number // empty")

          # Os candidatos vêm das LABELS de estado — o board não é consultado, e nem
          # precisa existir. A PRIORIDADE É DA DIREITA PARA A ESQUERDA DO FLUXO: o
          # trabalho mais adiantado vem primeiro. Terminar o que está quase pronto antes
          # de começar coisa nova é o que impede o board de encher de trabalho pela
          # metade — e trabalho pela metade não entrega nada, ocupa revisor, e envelhece
          # até o contexto de quem o escreveu se perder.
          : > /tmp/disponiveis.txt
          # `--label` repetido é E, não OU: o card precisa ter a do Anchors E a de estado.
          # O ESCALADO fica de fora — enquanto espera decisão humana, entregá-lo a um
          # agente produziria a revisão que já se sabe que não vai convergir.
          for estado in "anchors:ready-to-review" "anchors:to-do"; do
            gh issue list --state open --label "$LABEL" --label "$estado" \
              --limit 200 --json number,labels \
              --jq '.[] | select([.labels[].name] | index("anchors:precisa-do-usuario") | not) | .number' \
              >> /tmp/disponiveis.txt
          done

          # A ORDEM DE TRABALHO: um card cuja dependência não fechou não pode ser
          # entregue. Aconteceu no primeiro uso real — recebi a spec de test harness
          # (fase 3) com as fases 1 e 2 abertas, sem `package.json` sequer. Só não virou
          # trabalho perdido porque fui LER o plano.
          #
          # O `needs` vem do MAPA (`anchors.graph.yaml`), lido via API em vez de baixado:
          # este pipeline não faz checkout de propósito — ele roda a cada pedido de
          # trabalho, e clonar o repositório a cada vez o tornaria o gargalo que a
          # serialização já ameaça ser.
          gh api "repos/$GH_REPO/contents/anchors.graph.yaml" \
            --jq '.content' 2>/dev/null | base64 -d > /tmp/mapa.yaml || : > /tmp/mapa.yaml

          # Os códigos CONCLUÍDOS: os cards que já saíram da alçada do agente. Um `needs`
          # só está satisfeito quando o que ele aponta chegou até aqui.
          : > /tmp/concluidos.txt
          for e in "anchors:ready-to-test" "anchors:in-test" "anchors:ready-to-release" "anchors:production"; do
            gh issue list --state all --label "$LABEL" --label "$e" --limit 200 \
              --json title --jq '.[].title | capture("^\\[(?<c>[^]]+)\\]").c' >> /tmp/concluidos.txt 2>/dev/null || true
          done
          # Issue FECHADA também conta como concluída: fechar é o desfecho final, e exigir
          # a label depois disso deixaria a dependência presa para sempre.
          gh issue list --state closed --label "$LABEL" --limit 200 \
            --json title --jq '.[].title | capture("^\\[(?<c>[^]]+)\\]").c' >> /tmp/concluidos.txt 2>/dev/null || true

          # Entre os disponíveis, o LIVRE é o que ninguém tem E cujas dependências
          # fecharam. A ordem de /tmp/disponiveis.txt é a prioridade (review antes de
          # implementação).
          livre=""
          while read -r n; do
            [ -n "$n" ] || continue

            # BLOQUEADO por dependência? O código do card sai do título (`[XXXXX] ...`),
            # e o `needs` dele, do mapa.
            cod=$(gh issue view "$n" --json title --jq '.title | capture("^\\[(?<c>[^]]+)\\]").c' 2>/dev/null || true)
            if [ -n "$cod" ] && [ -s /tmp/mapa.yaml ]; then
              # As fases de um plano não são nós do mapa: elas vivem no markdown. Um
              # `needs` que aponta para fase é resolvido pelos CARDS que pertencem a ela —
              # se todos fecharam, a fase fechou.
              # O mapa indenta os nós com 4 espaços e escreve `needs:` como LISTA em
              # linhas separadas. Os padrões refletem isso — medi contra o arquivo real
              # antes de confiar: a primeira versão usava `^- id:` e `^  code:`, não
              # casava nada, e devolvia "sem dependência" para todo card.
              deps=$(awk -v alvo="$cod" '
                /^ *- id:/ { cod=""; emNeeds=0 }
                /^ *code: / { cod=$2 }
                /^ *needs:/ { emNeeds=1; next }
                /^ *[a-z_]+:/ { emNeeds=0 }
                emNeeds && /^ *- / && cod == alvo { print $2 }
              ' /tmp/mapa.yaml | grep -E '^[A-Z0-9]{4,5}(-F[0-9]{2})?$' || true)
              bloqueado=""
              for d in $deps; do
                # Uma dependência de FASE está satisfeita quando todo card daquela fase
                # concluiu. Um card sem nenhum card na fase não bloqueia: não há trabalho
                # declarado ali para esperar.
                if echo "$d" | grep -qE -- '-F[0-9]{2}$'; then
                  # `parent` vem DEPOIS de `code` no nó, então o código é guardado e
                  # impresso quando o parent casa.
                  pend=$(awk -v fase="$d" '
                    /^ *- id:/ { cod="" }
                    /^ *code: / { cod=$2 }
                    /^ *parent: / && $2 == fase && cod != "" { print cod }
                  ' /tmp/mapa.yaml | while read -r c; do
                    grep -qxF "$c" /tmp/concluidos.txt || echo "$c"
                  done)
                  [ -n "$pend" ] && bloqueado="$d"
                else
                  grep -qxF "$d" /tmp/concluidos.txt || bloqueado="$d"
                fi
                [ -n "$bloqueado" ] && break
              done
              if [ -n "$bloqueado" ]; then
                echo "· #$n ($cod) espera $bloqueado — pulando"
                continue
              fi
            fi

            dono=$(gh issue view "$n" --json comments \
              --jq '[.comments[].body | select(startswith("anchors-owner:"))] | last // ""')
            # O coringa no FIM é necessário: o pipeline de stale escreve o motivo depois
            # do marcador (`anchors-owner: (liberado) — sem progresso desde …`), e sem ele
            # o padrão exigiria que a linha TERMINASSE em "(liberado)" — nenhum card
            # liberado voltaria à fila, e o board travaria em silêncio.
            case "$dono" in
              ""|*"(liberado)"*) livre="$n"; break ;;
            esac
          done < /tmp/disponiveis.txt

          # O próprio card vence o que a varredura achou: ele foi procurado primeiro e só
          # não interrompeu o fluxo para que a mensagem final saiba distinguir "retomei o
          # meu" de "peguei um novo".
          retomado=""
          if [ -n "$meu" ]; then
            livre="$meu"; retomado="sim"
          fi

          if [ -z "$livre" ]; then
            echo "nenhum card livre"
            exit 0
          fi

          # A atribuição. O comentário é a posse; o assignee fica para a pessoa, no uso
          # normal do GitHub.
          gh issue comment "$livre" --body "anchors-owner: $AGENT"
          # Cada `ready-to-x` tem seu `in-x`: quem sai de `to-do` vai implementar, quem
          # sai de `ready-to-review` vai revisar. Mover para o estado errado faria o
          # board descrever um trabalho que não é o que está acontecendo.
          # `--jq index(...)` devolve VAZIO quando não acha (o gh engole o `null`), e
          # testar vazio com grep se comporta de forma imprevisível — foi assim que um
          # card em `to-do` foi movido para `in-review` na primeira execução real.
          # Listar as labels e procurar a linha exata não tem essa ambiguidade.
          labels_atuais=$(gh issue view "$livre" --json labels --jq '.labels[].name')
          if echo "$labels_atuais" | grep -qx "anchors:ready-to-review"; then
            de="anchors:ready-to-review"; para="anchors:in-review"
          elif echo "$labels_atuais" | grep -qx "anchors:in-review"; then
            # RETOMADA de um card que já estava em revisão: o estado não regride. Sem
            # este ramo o card cairia no `else` e voltaria para `in-progress` — o board
            # passaria a descrever implementação onde há revisão em curso.
            de="anchors:in-review"; para="anchors:in-review"
          elif echo "$labels_atuais" | grep -qx "anchors:in-progress"; then
            de="anchors:in-progress"; para="anchors:in-progress"
          else
            de="anchors:to-do"; para="anchors:in-progress"
          fi
          # Remove TODOS os estados, e não só o `$de` detectado: o estado é a label, e um
          # card que por qualquer motivo carregue dois estados manteria o outro colado
          # aqui. A remoção parcial não apenas falha em limpar — ela PERPETUA o estado
          # duplicado, porque cada transição seguinte também só remove um.
          #
          # A remoção e a adição vão em CHAMADAS SEPARADAS, e a remoção pula o estado de
          # destino: numa retomada `de == para`, e o `gh issue edit` que remove e adiciona
          # a MESMA label na mesma chamada aplica a remoção — o card ficava sem estado
          # nenhum, só com a label do Anchors. Medido no primeiro uso real da retomada.
          for e in anchors:to-do anchors:in-progress anchors:ready-to-review \
                   anchors:in-review anchors:ready-to-test anchors:in-test \
                   anchors:ready-to-release anchors:production; do
            [ "$e" = "$para" ] && continue
            gh issue edit "$livre" --remove-label "$e" >/dev/null 2>&1 || true
          done
          gh issue edit "$livre" --add-label "$para"

          # QUEM VAI REVISAR recebe as instruções no próprio card.
          #
          # O gate de JULGAMENTO faz a pergunta que nenhum verificador mecânico responde —
          # "o trecho REALIZA o que a regra descreve?" — e por isso ela fica pendente,
          # esperando alguém que esteja lendo spec e código ao mesmo tempo. A revisão é
          # exatamente esse momento: pedir o julgamento aqui aproveita a leitura que o
          # revisor já vai fazer, e pedir noutro lugar significaria ler duas vezes.
          if [ "$para" = "anchors:in-review" ]; then
            # A indentação do heredoc é exigida pelo YAML (o bloco `run:` a
            # define), e o `sed` a remove antes de escrever o arquivo — sem
            # isso o markdown chega ao GitHub como bloco de código.
            # AS VOLTAS DE REVISÃO são contadas e ANOTADAS no card, porque o desfecho
            # "corrija você mesmo" abre a possibilidade de dois revisores corrigirem um ao
            # outro para sempre — e cada volta PARECE progresso, então ninguém percebe.
            #
            # O número aparece SEMPRE, e não só no limite: quem pega a revisão precisa
            # saber se é a primeira ou a sétima antes de começar. Uma sétima merece ler o
            # histórico antes de opinar; uma primeira, não.
            voltas=$(gh issue view "$livre" --json comments \
              --jq '[.comments[].body | select(startswith("## Revisão"))] | length')
            voltas=${voltas:-0}
            proxima=$((voltas + 1))

            # DEZ é o limite, e aí o card sai da alçada dos agentes.
            #
            # Não é bloqueio arbitrário: dez revisões sem convergir não é problema de
            # código, é decisão que ninguém tomou. Continuar rodando produziria a décima
            # primeira, e o custo já foi pago nove vezes.
            #
            # A label é um EIXO à parte do estado: o card fica onde está, e o que muda é
            # quem pode destravá-lo. Fosse estado, ele sairia da coluna onde o trabalho
            # realmente parou.
            if [ "$voltas" -ge 10 ]; then
              gh issue edit "$livre" --add-label "anchors:precisa-do-usuario" >/dev/null 2>&1 || true
              # `printf` em vez de heredoc: o bash exige o delimitador de fecho na COLUNA
              # ZERO, e o YAML exige que tudo dentro de `run:` fique indentado. Os dois não
              # podem ser satisfeitos ao mesmo tempo — medido: o script quebrou com
              # "here-document delimited by end-of-file".
              printf '%s\n' \
                '🛑 **Este card precisa de uma decisão humana.**' '' \
                "São $voltas revisões sem convergir, e isso deixou de ser problema de código:" \
                'é uma decisão que ninguém tomou. A próxima revisão produziria a seguinte —' \
                'o custo já foi pago nove vezes.' '' \
                '**O que costuma estar por trás:** a spec não decide o que precisava decidir,' \
                'e cada revisor lê o vazio de um jeito. Leia as revisões anteriores e procure' \
                'o ponto em que elas discordam sobre o que a spec PEDE, não sobre o que o' \
                'código faz.' '' \
                '**Como destravar:** decida o ponto e escreva a decisão NA SPEC (uma regra' \
                'nova, com código). Depois remova a label `anchors:precisa-do-usuario` e o' \
                'fluxo segue.' '' \
                'Enquanto a label estiver aqui, o pipeline de claim não entrega este card.' \
                > /tmp/escala.md
              gh issue comment "$livre" --body-file /tmp/escala.md
              echo "· #$livre ESCALADO ao usuário — $voltas revisões sem convergir"
              exit 0
            fi

            if [ "$voltas" -ge 3 ]; then
              printf '%s\n' \
                '⚠ **A revisão não está convergindo.**' '' \
                'Quando isso acontece, o problema costuma estar ANTES do código: a spec não' \
                'decide o que precisava decidir, e cada revisor lê o vazio de um jeito.' '' \
                'Antes de revisar de novo, leia as revisões anteriores e pergunte se o' \
                'desacordo é sobre o CÓDIGO ou sobre o que a SPEC pede. Se for o segundo, o' \
                'caminho é abrir uma decisão em aberto na spec — não mais uma rodada.' \
                > /tmp/aviso.md
              gh issue comment "$livre" --body-file /tmp/aviso.md
            fi


            # `printf` em vez de heredoc: o bash exige o delimitador de fecho na COLUNA
            # ZERO, e o YAML exige que tudo dentro de `run:` fique indentado — os dois não
            # podem ser satisfeitos ao mesmo tempo. Medido: o script quebrou em produção
            # com "here-document delimited by end-of-file".
            printf '%s\n' \
              '## Revisão — o que fazer' \
              '' \
              '1. **Leia** a spec e o código que ela governa.' \
              '2. **Rode os gates de julgamento** pendentes:' \
              '' \
              '   ```' \
              '   anchors judge --pending' \
              '   anchors judge <alvo> --gate <gate> --verdict pass|fail --reason "..."' \
              '   ```' \
              '' \
              '   Eles fazem a pergunta que nenhum verificador mecânico responde: se o código REALIZA' \
              '   o que a regra descreve. Você já vai estar lendo os dois.' \
              '' \
              '3. **Confronte cada regra** da spec contra o que o PR entrega, rodando o que dá para' \
              '   rodar em vez de só ler.' \
              '4. **Comente o resultado no PR**, começando com `## Revisão` — é por esse título' \
              '   que o pipeline conta as voltas e avisa quando a revisão deixa de convergir.' \
              '   Depois escolha o desfecho:' \
              '' \
              '   - **aceito** → mova o card para `anchors:ready-to-test`.' \
              '' \
              '   - **defeito de EXECUÇÃO** (marcação no lugar errado, opção faltando, teste que' \
              '     não cobre o caso) → **corrija você mesmo**, no mesmo PR, e passe o card para' \
              '     `anchors:ready-to-review` liberando a posse. Outro agente revisa o conjunto.' \
              '' \
              '     Você já sabe qual é o certo: devolver faria outro descobrir o que você' \
              '     acabou de descobrir. E quando há correção são DOIS reviews de qualquer' \
              '     forma — a diferença é que aqui não há dois `claim` e uma releitura no meio.' \
              '' \
              '   - **defeito de ENTENDIMENTO** (a spec foi lida errado, a abordagem não serve)' \
              '     → **devolva**: card para `anchors:to-do`, posse para quem implementou, e o' \
              '     comentário dizendo o que a spec pede que o código não faz.' \
              '' \
              '     Aqui corrigir seria pior que moroso: esconderia que o autor entendeu errado,' \
              '     e o mesmo erro volta no próximo card que ele pegar.' \
              '' \
              '> **Quem corrige não aprova o próprio conserto.** Ao corrigir, você vira autor' \
              '> daquele trecho — por isso o card volta para `ready-to-review` em vez de seguir' \
              '> para `ready-to-test`. É a mesma regra que já vale para quem implementa.' \
              '' \
              '### Se o card voltou para `ready-to-review` enquanto você revisava' \
              '' \
              'O `stale` libera card sem sinal de vida, e revisar é justamente ler e pensar sem' \
              'tocar no repositório — uma revisão longa (ou uma noite de sono) atravessa o prazo.' \
              'Não é defeito: o pipeline não distingue "pensando" de "sumiu".' \
              '' \
              'Ele devolve o card a `ready-to-review`, e não a `to-do`: o PR está aberto e verde,' \
              'a implementação terminou — só a revisão não aconteceu.' \
              '' \
              'A recuperação depende de UMA pergunta — o card ainda é seu?' \
              '' \
              '- **último `anchors-owner:` é você** (ou `(liberado)`) → retome: comente' \
              '  `anchors-owner: <você>`, mova para `anchors:in-review` e siga de onde parou.' \
              '- **outro agente pegou** → deixe pra lá. Ele já está com o contexto, e disputar o' \
              '  card produziria dois revisores no mesmo trabalho. Peça outro com' \
              '  `gh workflow run anchors-claim.yml -f agent=<você>`.' \
              '' \
              '> O GitHub recusa `approve` no próprio PR, e os agentes desta máquina usam a mesma' \
              '> conta. Se o merge estiver bloqueado por isso, quem for admin usa' \
              '> `gh pr merge <n> --merge --admin`; quem não for, roda `anchors doctor --fix` para' \
              '> desligar a exigência (a revisão continua sendo cobrada pelo estado do card).' \
              > /tmp/instrucao.md
            # A CONTAGEM entra no topo da instrução: quem pega a sétima revisão precisa
            # saber disso ANTES de começar a ler, para procurar o desacordo em vez de
            # opinar do zero.
            printf '## Revisão %s deste card — o que fazer\n' "$proxima" > /tmp/cabecalho.md
            tail -n +2 /tmp/instrucao.md >> /tmp/cabecalho.md
            gh issue comment "$livre" --body-file /tmp/cabecalho.md
          fi

          if [ -n "$retomado" ]; then
            echo "card #$livre RETOMADO por $AGENT (já era dele): $de → $para"
          else
            echo "card #$livre atribuído a $AGENT: $de → $para"
          fi
