version: 2

project_name: anchors

before:
  hooks:
    - go mod tidy

builds:
  - main: ./cmd/anchors
    binary: anchors
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}

archives:
  - id: default
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'

release:
  github:
    owner: co2-lab
    name: anchors

  # A MESMA TAG pode disparar o workflow mais de uma vez, e o padrão (`append`) recusa o
  # artefato que já existe:
  #
  #   422 Validation Failed [{Resource:ReleaseAsset Field:name Code:already_exists}]
  #
  # Medido na v0.1.29: a tag foi refeita duas vezes por causa da mensagem, e o terceiro
  # release caiu ao subir o que o segundo já tinha publicado. A release ficou PUBLICADA e
  # CORRETA, o workflow ficou VERMELHO — o par que faz alguém refazer a tag e reproduzir o
  # erro.
  #
  # `replace` substitui o asset de mesmo nome. É seguro porque o conteúdo é derivado da
  # tag: reexecutar a mesma tag reconstrói o mesmo binário, e o que se sobrescreve é
  # idêntico ao que estava lá. Não é `mode: keep-existing` porque ali um build corrigido
  # não chegaria a substituir o artefato quebrado.
  mode: replace

# ── Linux: pacotes nativos ─────────────────────────────────────────────────────
# Gerados do mesmo binário, sem repositório extra a manter: quem usa Debian/Ubuntu ou
# Fedora baixa o .deb/.rpm da própria release e instala com o gerenciador do sistema.
nfpms:
  - id: default
    package_name: anchors
    vendor: co2lab
    homepage: https://anchors.co2lab.io
    maintainer: co2lab <contato@co2lab.io>
    description: "Anchors — framework spec-first de continuidade para desenvolvimento assistido por IA"
    license: Elastic License 2.0
    formats:
      - deb
      - rpm
      - apk

# ── Windows: Scoop ─────────────────────────────────────────────────────────────
# O manifesto vai para `co2-lab/scoop-bucket`.
scoops:
  - name: anchors
    repository:
      owner: co2-lab
      name: scoop-bucket
      # PAT CLÁSSICO, e não o fine-grained do tap: aquele token foi emitido ANTES de o
      # bucket existir, então não o tem na lista de repositórios — LÊ (200) e não ESCREVE
      # (403). Medido na v0.1.1, que caiu exatamente aqui.
      #
      # O caminho de menor privilégio seria emitir um fine-grained próprio do Anchors com
      # os três repositórios; fica registrado como dívida.
      token: "{{ .Env.WINGET_GITHUB_TOKEN }}"
    homepage: https://anchors.co2lab.io
    description: "Anchors — framework spec-first de continuidade para desenvolvimento assistido por IA"
    license: Elastic License 2.0

homebrew_casks:
  - name: anchors
    binaries:
      - anchors
    repository:
      owner: co2-lab
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: https://anchors.co2lab.io
    description: "Anchors — framework spec-first de continuidade para desenvolvimento assistido por IA"
