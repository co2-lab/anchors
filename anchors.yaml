  # A test's body is read by its layout; here a test opens with a LABEL
  # (`t.Run("CODE: title", func(t *testing.T) {})`) and the function around it is what
  # asserts, so an empty test stands for its block.
  - name: test-has-assertion
    check: test-has-assertion
    on: [test]
    blocking: false
    labels: true
  - name: test-exercises-unit
    check: test-exercises-unit
