# O idioma das mensagens. O Anchors suporta pt-BR, en e es.
lang: en
# anchors.yaml — o Anchors governando o próprio Anchors.
#
# Este arquivo é também um EXPERIMENTO de adoção: o Anchors nasceu para ser posto em
# projeto que já existe, e nunca foi posto num. Cada atrito encontrado aqui é defeito de
# produto, não do repositório — as anotações `# ATRITO:` marcam o que doeu.
#
# ATRITO 1 — `anchors init` sem TTY escreve `layers: {}` e imprime "✓ anchors.yaml escrito
# (0 camadas)". Sucesso aparente com resultado inútil: quem roda em CI, script ou pipe fica
# com um arquivo que carrega e não governa nada. Deveria falhar pedindo `--yes`/modo não
# interativo, ou inferir do escaneamento que ele mesmo acabou de fazer (ele JÁ detectou
# "código em: [cli/internal cli/cmd]" — e não usou; os caminhos daquele dia tinham o
# prefixo `cli/`, que saiu quando o `go.mod` foi para a raiz).
version: 4
layers:
  # ── A DOUTRINA ──────────────────────────────────────────────────────────────────
  # Os documentos que definem o que o Anchors é. Não são "docs": são a fonte das
  # regras que o CLI implementa, e por isso governam o código (ver `governs` abaixo).
  #
  # A lista e' EXPLICITA, e nao um `*.md` com exclusoes. O padrao aberto capturava todo
  # markdown da raiz como REGUA, e o `guide-checklist` entao cobrava pontos de
  # conformidade de quem nao rege nada: DECISIONS.md (registro de decisoes tomadas),
  # CLI.md e USING.md (documentacao de uso), DOCS.md (explica um conceito), BOOTSTRAP.md
  # (planejamento em construcao). Seis acusacoes que nao tinham conserto honesto — a
  # unica saida seria inventar regras para documentos que nao governam nada.
  #
  # O comentario anterior dizia "os 11 documentos" e o padrao capturava 13: a intencao
  # escrita ja divergia do que a Estrutura fazia. Nomear fecha a divergencia.
  doutrina:
    pattern: "{CONCEPT,PROPAGATION,QUALITY,SPEC,SPEC_TYPES,STRUCTURE,TRACEABILITY,WORKFLOW}.md"
    kind: guide
    tags: [doutrina, guide]

  # Documentacao de USO e registro de processo — explicam e narram, nao regem. Ficam
  # reconhecidos como doc para nao cairem em "nao regido", e fora do alcance dos gates
  # que cobram regua (`guide-checklist`).
  doc:
    pattern: "{README,PLANNING,PROJECT_STRUCTURE,BOOTSTRAP,CLI,DECISIONS,DOCS,USING}.md"
    kind: doc
    tags: [doc]

  # PRODUCT DOCTRINE — the rule that cuts across targets.
  #
  # Every spec has a TARGET, and co-location ties the triad to one directory. A rule that
  # holds for several units belongs to none of them: it was either duplicated (and
  # diverged at the first change) or lived in an arbitrary spec that the others
  # referenced implicitly. Here it has a place, and the spec points at it with
  # `@realizes`.
  produto:
    pattern: "product/*.doctrine.md"
    kind: product
    tags: [product, doutrina]

  # FEATURE FLAGS. A flag multiplica os caminhos do codigo sem multiplicar a spec: `if
  # flag("novo-checkout")` cria dois comportamentos e a spec descreve UM. Aqui cada flag
  # declara os CENARIOS por valor, e a spec aponta com `@gated-by` a regra que so' vale
  # sob um deles. O que o Anchors confronta e' o cenario declarado, nunca o valor real —
  # que muda por usuario e por minuto, e ao qual ele nao tem (nem deve ter) acesso.
  flags:
    pattern: "flags/*.flag.md"
    kind: flag
    tags: [flag, feature-flag]

  # Documentos de DESENHO — registram um conceito antes de implementa-lo: o problema
  # medido, as alternativas descartadas e as decisoes tomadas. Sao registro, nao regua,
  # pela mesma razao que DECISIONS.md: nao governam nada, e cobrar deles pontos de
  # conformidade obrigaria a inventar regras para um documento que so' narra escolhas.
  desenho:
    pattern: "DESIGN-*.md"
    kind: doc
    tags: [doc, desenho]

  # ── O CLI ───────────────────────────────────────────────────────────────────────
  # Comandos organizados por domínio, ponto de entrada do usuário — a INTERFACE
  # do framework, no vocabulário do próprio Anchors.
  comando:
    pattern: "cmd/anchors/**/*.go"
    kind: code
    tags: [cli, comando]
    exclude: ["**/*_test.go", "cmd/anchors/main.go", "cmd/anchors/root.go"]

  # ── AS REGRAS ───────────────────────────────────────────────────────────────────
  # Cada gate é uma REGRA do framework, com doutrina no cabeçalho do arquivo. É a
  # camada mais densa em decisão por linha — e a que mais se paga em spec.
  gate:
    pattern: "internal/gate/*.go"
    kind: code
    tags: [regra, gate]
    exclude: ["**/*_test.go"]

  # ── O NÚCLEO ────────────────────────────────────────────────────────────────────
  # A hierarquia abaixo é a REAL, medida por import (não suposta):
  #   config → (nada)   scan → config   mapx → config+scan   gate → config+scan+mapx+…
  config:
    pattern: "internal/config/*.go"
    kind: code
    tags: [nucleo, config]
    exclude: ["**/*_test.go"]

  scan:
    pattern: "internal/scan/*.go"
    kind: code
    tags: [nucleo, scan]
    exclude: ["**/*_test.go"]

  mapa:
    pattern: "internal/mapx/*.go"
    kind: code
    tags: [nucleo, mapa]
    exclude: ["**/*_test.go"]

  # ── INFRA ───────────────────────────────────────────────────────────────────────
  # Os pacotes de apoio: materializam artefato (issue, change, suggestion), leem
  # ambiente (gitmeta, daemon), medem (similarity, testsig, health) ou orquestram
  # (queue, recode, initx, pack, code, checklog). RECONHECIDA: não origina regra.
  infra:
    pattern: "internal/{change,checklog,code,daemon,gitmeta,health,initx,issue,pack,queue,recode,similarity,suggestion,testsig}/*.go"
    kind: code
    tags: [infra]
    regime: declarativo
    exclude: ["**/*_test.go"]

  # ── A TRINCA ────────────────────────────────────────────────────────────────────
  teste:
    pattern: "**/*_test.go"
    kind: test
    tags: [test]

  spec:
    pattern: "**/*.spec.md"
    kind: spec
    tags: [spec]

  feature:
    pattern: "**/*.feature"
    kind: feature
    tags: [feature]

  # Os guides que o próprio Anchors distribui (semeados no projeto do usuário).
  guide-distribuido:
    pattern: "guides/*.md"
    kind: guide
    tags: [guide]

# ── FRONTEIRAS ────────────────────────────────────────────────────────────────────
# Todas declaram o que HOJE NÃO ACONTECE (verificado por import), para que continue
# assim. Fronteira que já está violada não é fronteira: é dívida com nome bonito.
boundaries:
  - layer: gate
    forbid: "co2-lab/anchors/cmd"
    because: "gate é biblioteca de regras — quem conhece CLI é o comando, não a regra. Um gate que importa cmd não é testável sem subir o cobra."

  - layer: config
    forbid: "co2-lab/anchors/internal/(mapx|scan|gate)"
    because: "config é a base da pilha (não importa ninguém hoje). Depender de mapx/scan criaria ciclo: os três já importam config."

  - layer: scan
    forbid: "co2-lab/anchors/internal/(mapx|gate)"
    because: "scan lê TEXTO e classifica em camadas; o mapa é construído A PARTIR dele. Inverter faria o scan precisar do mapa que ele alimenta."

  - layer: mapa
    forbid: "co2-lab/anchors/internal/gate"
    because: "o mapa é o dado; o gate é quem o confronta. O gate importa mapx, nunca o contrário."

  # A regra que o próprio projeto mais repete na doutrina: o CLI não parseia código.
  - layer: scan
    forbid: "go/(ast|parser|types)"
    because: "STRUCTURE/D2: o Anchors é agnóstico de linguagem e nunca parseia código — lê texto e âncora em comentário. Um parser aqui amarraria o engine a Go."

# ── GOVERNS ───────────────────────────────────────────────────────────────────────
# A doutrina rege o código que a implementa. É a aresta que faz `anchors impact` num
# documento responder "estes gates dependem desta decisão".
governs:
  # ATRITO 2 — escrevi este bloco como `guide:`/`tags:` (plural) e o `map build` aceitou em
  # SILÊNCIO: 222 nós, 0 arestas, nenhum aviso. O formato real é `from`/`governs` com UMA
  # tag. Chave desconhecida em YAML é ignorada, e quem adota não tem como saber que a
  # declaração dele não fez nada — o mapa só fica pobre. Deveria avisar (chave não
  # reconhecida em `governs[0]`) ou falhar.
  - from: TRACEABILITY.md
    governs: mapa
  - from: TRACEABILITY.md
    governs: scan
  - from: QUALITY.md
    governs: regra
  - from: STRUCTURE.md
    governs: config
  - from: SPEC.md
    governs: spec
  - from: SPEC_TYPES.md
    governs: spec
  - from: PROPAGATION.md
    governs: mapa
  - from: CONCEPT.md
    governs: nucleo
  - from: WORKFLOW.md
    governs: infra

# ── GATES ─────────────────────────────────────────────────────────────────────────
# ATRITO 3 — `anchors init` não semeia NENHUM gate, e `anchors check` morre com "nenhum
# gate declarado". Quem adota sai do init com um arquivo que não permite rodar o comando
# principal do framework: init → map build → check → erro. O init deveria semear ao menos
# o conjunto mínimo (os que não exigem trinca), ou dizer o que falta.
#
# A ordem aqui é deliberada: primeiro os que medem a ESTRUTURA (valem desde o dia zero,
# sem escrever spec nenhuma), depois os da trinca — que só passam a fazer sentido conforme
# as specs nascem. Ligar tudo de uma vez num projeto existente produz centenas de issues
# no primeiro dia e ninguém lê a lista.
# ── A TRINCA: ONDE CADA PEÇA NASCE ───────────────────────────────────────────────
# ATRITO 5 — sem este bloco, a trinca NÃO EXISTE para o mapa. O `triadEdges` abre com
# `if cfg.Derived == nil { return nil }`, então um projeto sem `derived:` nunca ganha
# aresta `specifies`/`tested-by` — e os oito gates da trinca ficam declarados e cegos,
# reportados como "sem nada para medir". O sintoma é perfeitamente enganoso: parece
# faltar spec, e o que falta é a CONVENÇÃO que diz onde a spec mora.
#
# Pior: o `anchors init` só semeia este bloco quando DETECTA co-location — e detectar
# depende de já existirem specs. Projeto que adota o Anchors antes de ter a primeira
# spec (o caso normal, e o deste repositório) sai do init sem o bloco, escreve a spec
# no lugar certo, e o mapa não a liga a nada. Não há mensagem sobre isso em lugar nenhum.
#
# O template de teste do init (`{{name}}.test.{{ext}}`) é do dialeto JS/TS; em Go o
# teste é `{{name}}_test.go`. Herdá-lo aqui ligaria a spec a um arquivo que não existe.
# O DIALETO da stack: como este projeto ESCREVE as construcoes que os gates precisam
# reconhecer (funcao exportada, caso de teste, dublê). O Anchors nao supoe — sem a
# declaracao, os gates que leem codigo ficam INDETERMINADOS e dizem que ficaram, em vez
# de aprovar o que nao conferiram.
dialect:
  family: go

derived:
  # A SPEC é a âncora: dela nascem o código e o teste (CONCEPT: "da spec nascem o
  # código, a feature e o teste"). O inverso também é aceito pelo engine (`anchor: code`),
  # e seria a leitura errada aqui — num repositório onde o código veio primeiro, ancorar
  # nele congelaria a inversão que a doutrina existe para desfazer.
  anchor: spec
  # Como ESTE projeto escreve um simbolo publico. Sem a declaracao o `code-cataloged`
  # PULA e diz que pulou — um medidor que nao sabe medir tem de calar, nao aprovar. O
  # padrao embutido era de TS/JS (`export function NOME`), que em Go casa ZERO simbolos:
  # o gate reportaria verde sendo `blocking`, carimbando o que nao conferiu.
  #
  # Em Go a exportacao e' a MAIUSCULA inicial, e nao uma palavra-chave.
  export_detect: "^func\\s+([A-Z]\\w*)"
  # O de-para do vocabulario de REGIME de teste. Um cenario da feature declara a tag,
  # e o confronto a traduz para o regime canonico do framework antes de procurar a peca
  # que o prova. Tag sem mapeamento nao e' confrontada — e um opt-out silencioso, que e'
  # o que este bloco existe para evitar.
  #
  # Aqui ha UM regime, e a declaracao registra isso: os gates deste projeto se provam
  # por teste de unidade em Go, no arquivo ao lado. Nao ha suite de integracao nem de
  # ponta a ponta a mapear — declarar regimes que nao existem faria o confronto procurar
  # arquivos que ninguem pretende escrever.
  regimes:
    unit-level: unit
  surfaces:
    unit: test
  files:
    spec: ["{{dir}}/{{name}}.spec.md"]
    code: ["{{dir}}/{{name}}.go"]
    feature: ["{{dir}}/{{name}}.feature"]
    test: ["{{dir}}/{{name}}_test.go"]


gates:
  # SEGURANÇA — a leva que existe para o que não tem volta.
  #
  # Só o `secret-nao-vazado` nasce BLOQUEANTE, e o motivo é a assimetria: segredo vazado é
  # o único achado desta lista sem conserto barato — rotacionar chave custa, e o histórico
  # do git guarda a original. Os demais são informativos porque um achado deles é uma
  # PERGUNTA sobre contexto, e bloquear no primeiro dia treina a equipe a ignorar.

  - name: no-secret-leaked
    on: [code, test, doc, spec, feature, guide, plan]
    scope: batch
    scope_full: project
    run: "bash scripts/anchors-secrets.sh"
    needs_tool: gitleaks
    install_hint: "brew install gitleaks"
    blocking: true
    when: [pre-commit, pre-push, ci]
    cost: fast
    category: security
    measures: "nenhum segredo entra no repositório (gitleaks; allowlist declarada em .gitleaks.toml)"

  - name: dependency-vulnerable
    on: [code]
    scope: project
    run: "bash scripts/anchors-deps-vuln.sh"
    needs_tool: osv-scanner
    install_hint: "brew install osv-scanner"
    blocking: false
    when: [pre-push, ci]
    cost: fast
    category: security
    measures: "quantas CVEs conhecidas o go.mod carrega, por severidade (osv-scanner)"

  - name: license-compatible
    on: [code]
    scope: project
    run: "bash scripts/anchors-licenses.sh"
    needs_tool: go-licenses
    install_hint: "go install github.com/google/go-licenses@latest"
    blocking: true
    when: [pre-push, ci]
    cost: fast
    category: security
    measures: "nenhuma dependência copyleft forte no binário (incompatível com a ELv2)"

  - name: sbom-generated
    on: [code]
    scope: project
    run: "bash scripts/anchors-sbom.sh"
    needs_tool: syft
    install_hint: "brew install syft"
    blocking: false
    when: [ci]
    cost: slow
    category: security
    measures: "o inventário de componentes do binário, para quem audita o que distribuímos"

  - name: insecure-pattern
    on: [code]
    scope: batch
    scope_full: project
    run: "bash scripts/anchors-semgrep.sh {{files}}"
    needs_tool: semgrep
    install_hint: "brew install semgrep"
    blocking: false
    when: [pre-push, ci]
    cost: fast
    category: security
    measures: "padrões inseguros conhecidos em Go (semgrep p/gosec)"

  # ESTRUTURA — medem o código como ele está, sem exigir spec.
  - name: layer-boundary
    blocking: true
    measures: "as fronteiras entre camadas do CLI, verificadas por import real"

  - name: code-cataloged
    blocking: false

  - name: code-reference-valid
    blocking: false

  # TRINCA — informativos por enquanto: o projeto tem 0 specs para 127 arquivos de código,
  # e promovê-los a bloqueante hoje barraria todo commit. Sobem conforme a adoção avança.
  - name: triad-complete
    blocking: false

  - name: spec-has-code
    blocking: false

  - name: spec-complete
    blocking: false

  - name: feature-not-empty
    blocking: false

  # ── OS TRES QUE FECHAM O CIRCUITO CENARIO↔TESTE ─────────────────────────────────
  # Sem eles a trinca fecha ESTRUTURALMENTE e ninguem confere se os cenarios tem prova:
  # o `triad-complete` responde "as tres pecas existem", e nao "elas dizem a mesma
  # coisa". Uma feature com onze cenarios e um teste que prova dois passa igual.
  #
  # Ficam informativos ate o acervo de features crescer — promover agora reprovaria
  # cada unidade que ainda nao tem feature, que e' a lista inteira menos uma.

  # O cenario esta implementado no teste ligado? Confronta por CODIGO (reprova se
  # falta) e por DESCRICAO (avisa se divergiu). Pega o agente que pula um cenario,
  # renomeia ou muda os passos sem mexer no teste.
  #
  # Este declara `on:`/`check:` e os dois vizinhos nao — e a diferenca nao e' estilo: o
  # `feature-test-match` nao esta no catalogo canonico (`initx/default_gates.go`), entao
  # nao ha de onde herdar. Declarar so o `name:` o faria ser aceito EM SILENCIO e nunca
  # medir nada, que e' o ATRITO 4 registrado acima.
  - name: feature-test-match
    on: [feature]
    check: feature-test-match
    blocking: false
    measures: "cada cenario da feature esta implementado no teste ligado (por codigo e por descricao)"

  # O passo de resultado AFIRMA algo observavel? Um `Then` que diz "o efeito X se
  # verifica" e' tautologia: nao afirma resultado nenhum, passa nos gates, e dois
  # cenarios de regras diferentes ficam indistinguiveis.
  - name: scenario-asserts
    blocking: false

  # Cada cenario da spec tem um teste que PASSOU — cobertura semantica, nao de linha.
  # E' o unico dos tres que depende de sinal ingerido: sem `anchors ingest` dos
  # resultados, ele fica indeterminado e diz que ficou.
  - name: scenario-coverage
    blocking: false

  - name: docs-fresh
    blocking: false

  - name: sibling-guard
    blocking: false

  - name: no-duplication
    blocking: false

  - name: domain-declared
    blocking: false

  - name: open-questions-resolved
    blocking: false

  - name: rule-types
    blocking: false

  - name: spec-feature-match
    blocking: false

  - name: dependency-honored
    blocking: false

  - name: count-honored
    blocking: false

  - name: ref-resolves
    blocking: false

  # A COBERTURA da documentacao, ao lado do `docs-fresh`: aquele confere se a pagina
  # compilada reflete a spec, este se a spec chega a ALGUMA pagina. O segundo defeito e'
  # o silencioso — os templates filtram por camada, e a spec que nenhum filtro seleciona
  # compila para lugar nenhum enquanto todas as paginas seguem corretas.
  # O EIXO VERTICAL — a doutrina de produto e quem a realiza.
  - name: plan-doctrine-exists
    blocking: false

  - name: doctrine-realized
    blocking: false

  - name: spec-doctrine-exists
    blocking: false

  - name: doctrine-not-duplicated
    blocking: false

  # O EIXO DAS FEATURE FLAGS — os cenarios que o valor da flag abre.
  #
  # Os quatro `on:` vem do canonico (`mergeCanonical`): os tres primeiros sobre o arquivo
  # de flag, e o `flag-scenario-exists` sobre a spec, que e' quem cita.
  - name: flag-scenario-grammar

  - name: flag-scenarios-complete

  - name: flag-scenario-exists

  # INFORMATIVO: teste por cenario e' a regua certa e a mais cara de cumprir.
  - name: flag-covered
    blocking: false

  # Declarado e SEM camada que o acione: este repositorio e' um FRAMEWORK, e das 841
  # regras catalogadas a esmagadora maioria e' mecanica de gate, nao decisao de produto.
  # Exigir `@realizes` de todas forcaria inventar doutrina guarda-chuva so' para calar o
  # gate. Num projeto de produto, a camada de tela declara `requires_doctrine: true` e
  # ele passa a cobrar.
  - name: spec-realizes-doctrine
    blocking: false

  # A FALHA declarada, tratada e registrada. Este repositorio nao declara regras `-E`
  # (um CLI falha por retorno, nao por excecao em producao), entao os tres saem
  # indeterminados aqui — o veredito honesto para "nao ha' o que confrontar".
  - name: failure-handled
    blocking: false

  - name: failure-logged
    blocking: false

  - name: failure-declared
    blocking: false

  - name: docs-covered
    blocking: false

  - name: guide-checklist
    blocking: false

  - name: test-traceable
    blocking: false

  # ── FERRAMENTA GO — `run:`, não `check:` ─────────────────────────────────────────
  # O Anchors não reimplementa o que a ferramenta do stack já faz: ele CHAMA e lê o
  # veredito. `scope: repo` roda o comando UMA vez por varredura, não por arquivo — sem
  # isso, `go build` rodaria 125 vezes num check --all.
  # ATRITO 4: os tres gates abaixo nasceram `blocking: true` e NUNCA rodaram. Dois
  # defeitos empilhados, um mascarando o outro:
  #
  # 1. sem `on:`. O guard `len(alvos) == 0` (gate/gate.go) descarta o gate ANTES do
  #    switch de escopo, entao `scope: project` nao salva. E o merge canonico nao tinha
  #    de onde herdar: `build`/`vet`/`testes-passam` nao existem no catalogo do
  #    `initx/default_gates.go` (ao contrario de `layer-boundary`, que herda `on: [code]`
  #    e por isso sempre funcionou). Gate declarado com nome que o catalogo nao conhece
  #    e sem `on:` proprio e aceito EM SILENCIO e nunca mede nada.
  # 2. `./...` a partir da raiz. O modulo Go vivia em `cli/` e nao na raiz — quando o
  #    `on:` foi corrigido os tres passaram a reprovar com "directory prefix . does not
  #    contain main module", e a saida foi um `cd cli &&` em cada comando.
  #
  #    O `go.mod` FOI PARA A RAIZ (v0.1.78), porque o layout antigo quebrava o
  #    `go install` de quem instalava o Anchors — e com ele o `cd` saiu: `./...` a
  #    partir da raiz agora alcanca o modulo, que e o que o comando sempre quis dizer.
  #
  # Enquanto isso: nada — nem CI (so ha deploy-site e release-cli), nem o pre-commit —
  # verificava que o Anchors compila ou que a suite passa.
  - name: build
    on: [code]
    run: "go build ./..."
    scope: project
    blocking: true
    measures: "o projeto compila"

  - name: vet
    on: [code]
    run: "go vet ./..."
    scope: project
    blocking: true
    measures: "o `go vet` não acusa nada (a régua que vem com a linguagem)"

  - name: tests-green
    on: [code]
    run: "go test ./..."
    scope: project
    blocking: true
    measures: "os 85 arquivos de teste passam"

  # ── PROVA DE TESTE ──────────────────────────────────────────────────────────────
  # `mutation-score` é o único gate que responde "o teste PROVA a linha?" — todos os
  # outros respondem "a linha executou?" ou "a peça existe?". O catálogo do framework diz
  # que ele "nasce com o projeto", e o Anchors tem 85 arquivos de teste sem essa medição.
  #
  # Informativo e Pending até alguém ingerir o relatório: o Anchors não roda a ferramenta
  # de mutação (depende do stack — para Go, `go-mutesting` ou `gremlins`). Fica declarado
  # para que a ausência da medição seja VISÍVEL, em vez de silêncio.
  - name: mutation-score
    blocking: false

  - name: line-coverage
    blocking: false

  # ── CABEÇALHO ───────────────────────────────────────────────────────────────────
  # Cada pacote do Anchors JÁ tem doutrina no cabeçalho (`// Package X faz Y porque Z`) —
  # é a convenção mais consistente do repositório. O gate transforma hábito em régua.
  # Informativo primeiro: 125 arquivos de código, e nem todos seguem o formato `@anchors`.
  # ── THE PROJECT'S LANGUAGE POLICY ───────────────────────────────────────────────
  #
  # EVERYTHING in this repository is written in ENGLISH. Identifiers, comments, specs,
  # features, tests, doctrine documents, commit messages. The single exception is the
  # TRANSLATION CATALOG (`internal/i18n/locales/*.json`), which exists precisely to hold
  # every language the product speaks — that is its job, and nowhere else's.
  #
  # Why the exception is the only one, and why "comments may stay in the team's language"
  # was dropped: a mixed repository does not stay mixed in one place. The doctrine at the
  # top of each gate is the RAW MATERIAL of its spec — write the doctrine in one language
  # and the spec inherits it, then the feature mirrors the spec, then the test title
  # mirrors the feature. Measured here, in one sitting: specs came out in Portuguese
  # because the doctrine was, while the features came out in English, and the same unit
  # ended up split across two languages. The mixture propagates through the very links
  # the framework exists to keep tight.
  #
  # This gate defends the part a compiler can see: IDENTIFIERS. Comments and user-facing
  # strings it deliberately does not read — the first because reading prose for language
  # is guesswork, the second because the translation catalog already resolves it by the
  # project's `lang:`. That they are out of the GATE's reach does not put them outside the
  # POLICY; it means the policy holds them by review, and this comment is where a reviewer
  # reads it.
  - name: code-language
    on: [code]
    scope: project
    run: "bash scripts/anchors-language.sh"
    blocking: true
    when: [pre-commit, pre-push, ci]
    category: consistency
    measures: "nenhum identificador em português — o código é em inglês (comentários não contam)"

  - name: header-valid
    blocking: false
